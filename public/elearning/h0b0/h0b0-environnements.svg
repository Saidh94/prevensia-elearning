<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="36" font-weight="700">Types d'environnements — H0B0</text>
  <text x="600" y="126" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20">Observer l'environnement avant d'agir est un réflexe de sécurité essentiel.</text>

  <!-- Carte 1 : CHAMP LIBRE -->
  <rect x="64" y="148" width="524" height="210" rx="18" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.5"/>
  <rect x="64" y="148" width="524" height="58" rx="18" fill="#15803D"/>
  <rect x="64" y="188" width="524" height="18" fill="#15803D"/>
  <text x="326" y="187" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="23" font-weight="700">CHAMP LIBRE — Risque FAIBLE</text>

  <text x="88" y="242" fill="#166534" font-family="Arial, sans-serif" font-size="21">✔  Armoires fermées, capots en place</text>
  <text x="88" y="276" fill="#166534" font-family="Arial, sans-serif" font-size="21">✔  Signalisation présente, zones respectées</text>
  <text x="88" y="336" fill="#14532D" font-family="Arial, sans-serif" font-size="19" font-weight="700">→ Évoluer normalement — sans jamais toucher</text>

  <!-- Carte 2 : LOCAL RÉSERVÉ -->
  <rect x="612" y="148" width="524" height="210" rx="18" fill="#FEF9C3" stroke="#EAB308" stroke-width="2.5"/>
  <rect x="612" y="148" width="524" height="58" rx="18" fill="#92400E"/>
  <rect x="612" y="188" width="524" height="18" fill="#92400E"/>
  <text x="874" y="187" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">LOCAL RÉSERVÉ — Risque MODÉRÉ</text>

  <text x="636" y="242" fill="#78350F" font-family="Arial, sans-serif" font-size="21">⚠  Accès restreint aux électriciens</text>
  <text x="636" y="276" fill="#78350F" font-family="Arial, sans-serif" font-size="21">⚠  Pièces actives potentiellement présentes</text>
  <text x="636" y="336" fill="#92400E" font-family="Arial, sans-serif" font-size="19" font-weight="700">→ Entrer seulement si autorisé — ne pas ouvrir</text>

  <!-- Carte 3 : ARMOIRE OUVERTE -->
  <rect x="64" y="378" width="524" height="210" rx="18" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="64" y="378" width="524" height="58" rx="18" fill="#DC2626"/>
  <rect x="64" y="418" width="524" height="18" fill="#DC2626"/>
  <text x="326" y="417" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="23" font-weight="700">ARMOIRE OUVERTE — Risque ÉLEVÉ</text>

  <text x="88" y="472" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Parties actives visibles ou accessibles</text>
  <text x="88" y="506" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Zone de voisinage électrique active</text>
  <text x="88" y="566" fill="#B91C1C" font-family="Arial, sans-serif" font-size="19" font-weight="700">→ S'éloigner et signaler immédiatement</text>

  <!-- Carte 4 : PROVISOIRE / DÉGRADÉ -->
  <rect x="612" y="378" width="524" height="210" rx="18" fill="#FFF1F2" stroke="#9F1239" stroke-width="3"/>
  <rect x="612" y="378" width="524" height="58" rx="18" fill="#9F1239"/>
  <rect x="612" y="418" width="524" height="18" fill="#9F1239"/>
  <text x="874" y="417" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">PROVISOIRE / DÉGRADÉ — Risque TRÈS ÉLEVÉ</text>

  <text x="636" y="472" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Matériel abîmé, protections absentes</text>
  <text x="636" y="506" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Milieu humide, coactivité non maîtrisée</text>
  <text x="636" y="566" fill="#9F1239" font-family="Arial, sans-serif" font-size="19" font-weight="700">→ Arrêt immédiat — aucun geste sans cadre</text>

  <!-- Barre bas -->
  <rect x="64" y="606" width="1072" height="32" rx="12" fill="#1E3A5F"/>
  <text x="600" y="627" text-anchor="middle" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="16" font-weight="700">Règle universelle H0B0 : observer avant d'agir — arrêter et signaler en cas de doute</text>
</svg>
