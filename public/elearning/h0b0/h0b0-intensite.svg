<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#FFF1F2"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#FECDD3" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#9F1239" font-family="Arial, sans-serif" font-size="36" font-weight="700">Intensité du courant — effets sur le corps</text>
  <text x="600" y="126" text-anchor="middle" fill="#BE123C" font-family="Arial, sans-serif" font-size="20">La gravité dépend de l'intensité, de la durée et du trajet dans le corps.</text>

  <!-- Bloc 1 : 0,5 mA -->
  <rect x="64" y="148" width="195" height="222" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <rect x="64" y="148" width="195" height="52" rx="16" fill="#15803D"/>
  <rect x="64" y="182" width="195" height="18" fill="#15803D"/>
  <text x="161" y="181" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">PERCEPTION</text>
  <text x="161" y="228" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="38" font-weight="700">0,5 mA</text>
  <text x="161" y="264" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="18">Légère sensation</text>
  <text x="161" y="288" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="18">Fourmillement</text>
  <text x="161" y="354" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="15" font-weight="700">Pas dangereux</text>

  <!-- Flèche -->
  <text x="272" y="264" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="28">→</text>

  <!-- Bloc 2 : 5 mA -->
  <rect x="280" y="148" width="195" height="222" rx="16" fill="#FEF9C3" stroke="#FDE68A" stroke-width="2"/>
  <rect x="280" y="148" width="195" height="52" rx="16" fill="#92400E"/>
  <rect x="280" y="182" width="195" height="18" fill="#92400E"/>
  <text x="377" y="181" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">CHOC NET</text>
  <text x="377" y="228" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="38" font-weight="700">5 mA</text>
  <text x="377" y="264" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="18">Contraction musculaire</text>
  <text x="377" y="288" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-size="18">Risque de chute</text>
  <text x="377" y="354" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="15" font-weight="700">Début du danger</text>

  <!-- Flèche -->
  <text x="488" y="264" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="28">→</text>

  <!-- Bloc 3 : 10 mA -->
  <rect x="496" y="148" width="208" height="222" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="496" y="148" width="208" height="52" rx="16" fill="#B45309"/>
  <rect x="496" y="182" width="208" height="18" fill="#B45309"/>
  <text x="600" y="181" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">⚠ NON-LÂCHER</text>
  <text x="600" y="228" text-anchor="middle" fill="#B45309" font-family="Arial, sans-serif" font-size="38" font-weight="700">10 mA</text>
  <text x="600" y="264" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18">Impossible de lâcher</text>
  <text x="600" y="288" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18">Prolonge l'exposition</text>
  <text x="600" y="354" text-anchor="middle" fill="#B45309" font-family="Arial, sans-serif" font-size="15" font-weight="700">Danger réel</text>

  <!-- Flèche -->
  <text x="717" y="264" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="28">→</text>

  <!-- Bloc 4 : 30 mA -->
  <rect x="725" y="148" width="195" height="222" rx="16" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2.5"/>
  <rect x="725" y="148" width="195" height="52" rx="16" fill="#DC2626"/>
  <rect x="725" y="182" width="195" height="18" fill="#DC2626"/>
  <text x="822" y="181" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">DANGER GRAVE</text>
  <text x="822" y="228" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="38" font-weight="700">30 mA</text>
  <text x="822" y="264" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18">Paralysie respiratoire</text>
  <text x="822" y="288" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18">Risque d'évanouissement</text>
  <text x="822" y="354" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="15" font-weight="700">Seuil DDR 30 mA</text>

  <!-- Flèche -->
  <text x="933" y="264" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="28">→</text>

  <!-- Bloc 5 : 75 mA -->
  <rect x="941" y="148" width="195" height="222" rx="16" fill="#FFF1F2" stroke="#9F1239" stroke-width="3"/>
  <rect x="941" y="148" width="195" height="52" rx="16" fill="#9F1239"/>
  <rect x="941" y="182" width="195" height="18" fill="#9F1239"/>
  <text x="1038" y="181" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">MORTEL</text>
  <text x="1038" y="228" text-anchor="middle" fill="#9F1239" font-family="Arial, sans-serif" font-size="38" font-weight="700">75 mA</text>
  <text x="1038" y="264" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18">Fibrillation ventriculaire</text>
  <text x="1038" y="288" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18">Arrêt cardiaque possible</text>
  <text x="1038" y="354" text-anchor="middle" fill="#9F1239" font-family="Arial, sans-serif" font-size="15" font-weight="700">Risque mortel immédiat</text>

  <!-- Bloc facteurs + données -->
  <rect x="64" y="390" width="1072" height="258" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>

  <text x="92" y="428" fill="#C2410C" font-family="Arial, sans-serif" font-size="21" font-weight="700">Facteurs qui aggravent :</text>
  <text x="92" y="462" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20">• Durée d'exposition prolongée (non-lâcher) — plus longtemps = plus grave</text>
  <text x="92" y="492" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20">• Trajet main-main ou main-pieds traversant le cœur</text>
  <text x="92" y="522" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20">• Humidité (peau, sol) — réduit la résistance du corps</text>

  <line x1="92" y1="542" x2="1108" y2="542" stroke="#F97316" stroke-width="1.5"/>

  <text x="92" y="572" fill="#9F1239" font-family="Arial, sans-serif" font-size="20">France : accidents électriques dont 3 décès et 46 nouvelles incapacités permanentes (données CNAM).</text>
  <text x="92" y="602" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20">Cause n°1 : mode opératoire inadapté · Cause n°2 : méconnaissance des risques.</text>
  <text x="92" y="632" fill="#9A3412" font-family="Arial, sans-serif" font-size="18" font-weight="700">La prévention comportementale est aussi essentielle que la prévention technique.</text>
</svg>
