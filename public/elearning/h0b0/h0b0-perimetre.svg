<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#EFF6FF"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#BFDBFE" stroke-width="2"/>

  <!-- Titre -->
  <text x="600" y="96" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="36" font-weight="700">Périmètre de l'habilitation H0B0</text>
  <text x="600" y="132" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20">Évoluer dans un environnement ≠ Agir sur l'installation</text>

  <!-- Colonne AUTORISÉ -->
  <rect x="64" y="156" width="508" height="448" rx="20" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.5"/>
  <rect x="64" y="156" width="508" height="68" rx="20" fill="#16A34A"/>
  <rect x="64" y="200" width="508" height="24" fill="#16A34A"/>
  <text x="318" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">✓  AUTORISÉ</text>

  <text x="318" y="258" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="18" font-weight="700">Opérations d'ordre NON électrique</text>

  <text x="88" y="304" fill="#166534" font-family="Arial, sans-serif" font-size="22">✔  Évoluer près des installations</text>
  <text x="88" y="352" fill="#166534" font-family="Arial, sans-serif" font-size="22">✔  Travaux mécaniques, nettoyage</text>
  <text x="88" y="400" fill="#166534" font-family="Arial, sans-serif" font-size="22">✔  Manutention, logistique</text>
  <text x="88" y="448" fill="#166534" font-family="Arial, sans-serif" font-size="22">✔  Signaler une anomalie visible</text>
  <text x="88" y="496" fill="#166534" font-family="Arial, sans-serif" font-size="22">✔  Stopper en cas de doute</text>

  <rect x="88" y="528" width="460" height="56" rx="12" fill="#DCFCE7"/>
  <text x="318" y="553" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="18" font-weight="700">Travailler à proximité — jamais dessus</text>
  <text x="318" y="573" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="16">NF C 18-510 — opérations non électriques</text>

  <!-- Colonne INTERDIT -->
  <rect x="628" y="156" width="508" height="448" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="628" y="156" width="508" height="68" rx="20" fill="#DC2626"/>
  <rect x="628" y="200" width="508" height="24" fill="#DC2626"/>
  <text x="882" y="200" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">✗  INTERDIT — TOUJOURS</text>

  <text x="882" y="258" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18" font-weight="700">Opérations d'ordre électrique</text>

  <text x="652" y="304" fill="#991B1B" font-family="Arial, sans-serif" font-size="22">✘  Ouvrir armoire ou coffret</text>
  <text x="652" y="352" fill="#991B1B" font-family="Arial, sans-serif" font-size="22">✘  Intervenir sur l'installation</text>
  <text x="652" y="400" fill="#991B1B" font-family="Arial, sans-serif" font-size="22">✘  Consigner, mesurer, dépanner</text>
  <text x="652" y="448" fill="#991B1B" font-family="Arial, sans-serif" font-size="22">✘  Réparer câble, prise, fiche</text>
  <text x="652" y="496" fill="#991B1B" font-family="Arial, sans-serif" font-size="22">✘  Franchir un balisage</text>

  <rect x="652" y="528" width="460" height="56" rx="12" fill="#FEE2E2"/>
  <text x="882" y="553" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18" font-weight="700">Même si l'action semble simple ou rapide</text>
  <text x="882" y="573" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="16">Stop — signaler — laisser la personne compétente</text>

  <!-- Barre bas -->
  <rect x="64" y="622" width="1072" height="26" rx="12" fill="#1E3A5F"/>
  <text x="600" y="640" text-anchor="middle" fill="#BFDBFE" font-family="Arial, sans-serif" font-size="15" font-weight="700">Formation ≠ Habilitation  ·  L'employeur délivre l'habilitation après évaluation du poste réel</text>
</svg>
