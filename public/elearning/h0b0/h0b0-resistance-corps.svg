<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="36" font-weight="700">Résistance du corps humain</text>
  <text x="600" y="126" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="19">L'humidité réduit la résistance — le même contact devient bien plus dangereux. (I = U / R)</text>

  <!-- Colonne 1 : Peau sèche -->
  <rect x="64" y="148" width="328" height="370" rx="20" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
  <rect x="64" y="148" width="328" height="66" rx="20" fill="#15803D"/>
  <rect x="64" y="194" width="328" height="20" fill="#15803D"/>
  <text x="228" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">PEAU SÈCHE</text>

  <text x="228" y="250" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17">Résistance du corps</text>
  <text x="228" y="292" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="46" font-weight="700">5 000 Ω</text>
  <text x="228" y="320" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="16">(1 000 à 10 000 Ω selon contact)</text>

  <line x1="88" y1="338" x2="368" y2="338" stroke="#86EFAC" stroke-width="1.5"/>

  <text x="228" y="366" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17">Tension limite AC</text>
  <text x="228" y="400" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="38" font-weight="700">50 V</text>

  <line x1="88" y1="416" x2="368" y2="416" stroke="#86EFAC" stroke-width="1.5"/>

  <text x="228" y="440" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17">Courant à 50 V</text>
  <text x="228" y="470" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="32" font-weight="700">≈ 10 mA</text>
  <text x="228" y="496" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="15">Tétanisation possible</text>

  <!-- Badge risque -->
  <rect x="88" y="510" width="280" height="34" rx="10" fill="#DCFCE7"/>
  <text x="228" y="533" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17" font-weight="700">Risque présent</text>

  <!-- Colonne 2 : Peau humide -->
  <rect x="436" y="148" width="328" height="370" rx="20" fill="#FFF7ED" stroke="#F97316" stroke-width="2.5"/>
  <rect x="436" y="148" width="328" height="66" rx="20" fill="#EA580C"/>
  <rect x="436" y="194" width="328" height="20" fill="#EA580C"/>
  <text x="600" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">PEAU HUMIDE</text>

  <text x="600" y="250" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">Résistance du corps</text>
  <text x="600" y="292" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="46" font-weight="700">2 500 Ω</text>
  <text x="600" y="320" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="16">(sueur, eau, humidité ambiante)</text>

  <line x1="460" y1="338" x2="740" y2="338" stroke="#FDBA74" stroke-width="1.5"/>

  <text x="600" y="366" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">Tension limite AC</text>
  <text x="600" y="400" text-anchor="middle" fill="#EA580C" font-family="Arial, sans-serif" font-size="38" font-weight="700">25 V</text>

  <line x1="460" y1="416" x2="740" y2="416" stroke="#FDBA74" stroke-width="1.5"/>

  <text x="600" y="440" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">Courant à 50 V</text>
  <text x="600" y="470" text-anchor="middle" fill="#EA580C" font-family="Arial, sans-serif" font-size="32" font-weight="700">≈ 20 mA</text>
  <text x="600" y="496" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="15">Paralysie musculaire probable</text>

  <!-- Badge risque -->
  <rect x="460" y="510" width="280" height="34" rx="10" fill="#FFEDD5"/>
  <text x="600" y="533" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="17" font-weight="700">Risque élevé</text>

  <!-- Flèche entre colonnes -->
  <text x="410" y="350" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="32">→</text>
  <text x="782" y="350" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="32">→</text>

  <!-- Colonne 3 : Peau mouillée -->
  <rect x="808" y="148" width="328" height="370" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="808" y="148" width="328" height="66" rx="20" fill="#DC2626"/>
  <rect x="808" y="194" width="328" height="20" fill="#DC2626"/>
  <text x="972" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">PEAU MOUILLÉE</text>

  <text x="972" y="250" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17">Résistance du corps</text>
  <text x="972" y="292" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="46" font-weight="700">1 000 Ω</text>
  <text x="972" y="320" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="16">(sol mouillé, immersion partielle)</text>

  <line x1="832" y1="338" x2="1112" y2="338" stroke="#FCA5A5" stroke-width="1.5"/>

  <text x="972" y="366" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17">Tension limite AC</text>
  <text x="972" y="400" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="38" font-weight="700">12 V</text>

  <line x1="832" y1="416" x2="1112" y2="416" stroke="#FCA5A5" stroke-width="1.5"/>

  <text x="972" y="440" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17">Courant à 50 V</text>
  <text x="972" y="470" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="32" font-weight="700">≈ 50 mA</text>
  <text x="972" y="496" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="15">Risque de fibrillation cardiaque</text>

  <!-- Badge risque -->
  <rect x="832" y="510" width="280" height="34" rx="10" fill="#FEE2E2"/>
  <text x="972" y="533" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="17" font-weight="700">Risque mortel</text>

  <!-- Barre bas -->
  <rect x="64" y="566" width="1072" height="68" rx="14" fill="#0F172A"/>
  <text x="600" y="591" text-anchor="middle" fill="#FDE68A" font-family="Arial, sans-serif" font-size="19" font-weight="700">Formule clé : I = U / R — pour une tension identique, si R baisse, I augmente.</text>
  <text x="600" y="618" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="17">Chantier extérieur, nettoyage, atelier humide : vigilance renforcée même à basse tension.</text>
</svg>
