<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="36" font-weight="700">Consignes, signalisation et documents</text>
  <text x="600" y="126" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20">La sécurité ne repose pas que sur la mémoire — les consignes du site ont valeur réglementaire.</text>

  <!-- Colonne gauche : Signalisation -->
  <rect x="64" y="148" width="508" height="418" rx="20" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <rect x="64" y="148" width="508" height="62" rx="20" fill="#B45309"/>
  <rect x="64" y="190" width="508" height="20" fill="#B45309"/>
  <text x="318" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">⚠  SIGNALISATION</text>

  <!-- Picto 1 -->
  <rect x="88" y="230" width="460" height="64" rx="12" fill="#FEF3C7"/>
  <text x="112" y="256" fill="#92400E" font-family="Arial, sans-serif" font-size="28">⚡</text>
  <text x="152" y="252" fill="#78350F" font-family="Arial, sans-serif" font-size="20" font-weight="700">DANGER ÉLECTRIQUE</text>
  <text x="152" y="276" fill="#92400E" font-family="Arial, sans-serif" font-size="17">Pièces sous tension — ne pas toucher</text>

  <!-- Picto 2 -->
  <rect x="88" y="306" width="460" height="64" rx="12" fill="#FEF3C7"/>
  <text x="112" y="332" fill="#DC2626" font-family="Arial, sans-serif" font-size="28">🚫</text>
  <text x="152" y="328" fill="#78350F" font-family="Arial, sans-serif" font-size="20" font-weight="700">ACCÈS RÉSERVÉ</text>
  <text x="152" y="352" fill="#92400E" font-family="Arial, sans-serif" font-size="17">Local électrique — électriciens habilités uniquement</text>

  <!-- Picto 3 -->
  <rect x="88" y="382" width="460" height="64" rx="12" fill="#FEF3C7"/>
  <text x="112" y="408" fill="#B45309" font-family="Arial, sans-serif" font-size="28">🚧</text>
  <text x="152" y="404" fill="#78350F" font-family="Arial, sans-serif" font-size="20" font-weight="700">BALISAGE EN PLACE</text>
  <text x="152" y="428" fill="#92400E" font-family="Arial, sans-serif" font-size="17">Ne jamais franchir ni déplacer</text>

  <!-- Picto 4 -->
  <rect x="88" y="458" width="460" height="64" rx="12" fill="#FEF3C7"/>
  <text x="112" y="484" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28">📋</text>
  <text x="152" y="480" fill="#78350F" font-family="Arial, sans-serif" font-size="20" font-weight="700">CONSIGNES AFFICHÉES</text>
  <text x="152" y="504" fill="#92400E" font-family="Arial, sans-serif" font-size="17">Lire et respecter avant toute action</text>

  <text x="318" y="554" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18" font-weight="700">Absence de signalisation ≠ absence de danger</text>

  <!-- Colonne droite : Documents et consignes -->
  <rect x="628" y="148" width="508" height="418" rx="20" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <rect x="628" y="148" width="508" height="62" rx="20" fill="#1D4ED8"/>
  <rect x="628" y="190" width="508" height="20" fill="#1D4ED8"/>
  <text x="882" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="700">📄  DOCUMENTS APPLICABLES</text>

  <!-- Doc 1 -->
  <rect x="652" y="230" width="460" height="64" rx="12" fill="#DBEAFE"/>
  <text x="676" y="252" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Consigne d'accès au site</text>
  <text x="676" y="276" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">Zones autorisées, cheminements, horaires</text>

  <!-- Doc 2 -->
  <rect x="652" y="306" width="460" height="64" rx="12" fill="#DBEAFE"/>
  <text x="676" y="328" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Instructions de sécurité</text>
  <text x="676" y="352" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">Spécifiques au poste ou à la zone de travail</text>

  <!-- Doc 3 -->
  <rect x="652" y="382" width="460" height="64" rx="12" fill="#DBEAFE"/>
  <text x="676" y="404" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Autorisation de travail / permis</text>
  <text x="676" y="428" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">Requis pour certaines zones ou interventions</text>

  <!-- Doc 4 -->
  <rect x="652" y="458" width="460" height="64" rx="12" fill="#DBEAFE"/>
  <text x="676" y="480" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Plan de prévention / PPSPS</text>
  <text x="676" y="504" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">Coordination sécurité sur chantier</text>

  <text x="882" y="554" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="18" font-weight="700">Ne pas connaître une consigne ne dispense pas de la respecter</text>

  <!-- Barre bas -->
  <rect x="64" y="584" width="1072" height="44" rx="14" fill="#1E3A5F"/>
  <text x="600" y="603" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="17" font-weight="700">La signalisation, les balisages et les consignes sont des outils de prévention — pas des suggestions.</text>
  <text x="600" y="621" text-anchor="middle" fill="#93C5FD" font-family="Arial, sans-serif" font-size="15">En cas de doute sur une consigne ou un accès : arrêt immédiat et demande à la personne compétente.</text>
</svg>
