<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F0F9FF"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#BAE6FD" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#0C4A6E" font-family="Arial, sans-serif" font-size="36" font-weight="700">Rôles et responsabilités</text>
  <text x="600" y="126" text-anchor="middle" fill="#0369A1" font-family="Arial, sans-serif" font-size="20">Chaque acteur a un rôle précis — la sécurité repose sur leur articulation.</text>

  <!-- EMPLOYEUR -->
  <rect x="64" y="152" width="230" height="330" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="2.5"/>
  <rect x="64" y="152" width="230" height="58" rx="18" fill="#EA580C"/>
  <rect x="64" y="192" width="230" height="18" fill="#EA580C"/>
  <text x="179" y="189" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">EMPLOYEUR</text>
  <text x="179" y="234" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="17" font-weight="700">Organise la prévention</text>
  <text x="86" y="268" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">▸ Évalue les risques</text>
  <text x="86" y="298" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">▸ Définit les habilitations</text>
  <text x="86" y="328" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">▸ Délivre les titres</text>
  <text x="86" y="358" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">▸ Fournit les protections</text>
  <rect x="86" y="420" width="186" height="44" rx="10" fill="#FEF3C7"/>
  <text x="179" y="437" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="15" font-weight="700">Délivre SEUL</text>
  <text x="179" y="457" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="15">l'habilitation</text>

  <!-- Flèche -->
  <text x="308" y="330" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="38" font-weight="700">→</text>

  <!-- ENCADREMENT -->
  <rect x="326" y="152" width="230" height="330" rx="18" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
  <rect x="326" y="152" width="230" height="58" rx="18" fill="#15803D"/>
  <rect x="326" y="192" width="230" height="18" fill="#15803D"/>
  <text x="441" y="189" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">ENCADREMENT</text>
  <text x="441" y="234" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17" font-weight="700">Contrôle l'adéquation</text>
  <text x="348" y="268" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Vérifie mission / habilitation</text>
  <text x="348" y="298" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ S'assure des conditions</text>
  <text x="348" y="328" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Traite les anomalies</text>
  <text x="348" y="358" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Applique les consignes</text>
  <rect x="348" y="420" width="186" height="44" rx="10" fill="#DCFCE7"/>
  <text x="441" y="437" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="15" font-weight="700">Contrôle</text>
  <text x="441" y="457" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="15">la mise en œuvre</text>

  <!-- Flèche -->
  <text x="570" y="330" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="38" font-weight="700">→</text>

  <!-- SALARIÉ H0B0 -->
  <rect x="588" y="152" width="230" height="330" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
  <rect x="588" y="152" width="230" height="58" rx="18" fill="#1D4ED8"/>
  <rect x="588" y="192" width="230" height="18" fill="#1D4ED8"/>
  <text x="703" y="183" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">SALARIÉ</text>
  <text x="703" y="201" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="700">H0 / B0 / H0V</text>
  <text x="703" y="234" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="17" font-weight="700">Respecte son périmètre</text>
  <text x="610" y="268" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Applique les consignes</text>
  <text x="610" y="298" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Reste dans son symbole</text>
  <text x="610" y="328" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Signale toute anomalie</text>
  <text x="610" y="358" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Refuse hors périmètre</text>
  <rect x="610" y="420" width="186" height="44" rx="10" fill="#DBEAFE"/>
  <text x="703" y="437" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Exécute</text>
  <text x="703" y="457" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="15">dans son cadre strict</text>

  <!-- FORMATEUR (boîte séparée à droite) -->
  <rect x="858" y="152" width="262" height="330" rx="18" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2.5"/>
  <rect x="858" y="152" width="262" height="58" rx="18" fill="#7C3AED"/>
  <rect x="858" y="192" width="262" height="18" fill="#7C3AED"/>
  <text x="989" y="189" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">FORMATEUR</text>
  <text x="989" y="234" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="17" font-weight="700">Transmet le cadre</text>
  <text x="880" y="268" fill="#5B21B6" font-family="Arial, sans-serif" font-size="17">▸ Apporte la formation</text>
  <text x="880" y="298" fill="#5B21B6" font-family="Arial, sans-serif" font-size="17">▸ Évalue les acquis</text>
  <text x="880" y="328" fill="#5B21B6" font-family="Arial, sans-serif" font-size="17">▸ Prépare à l'habilitation</text>
  <text x="880" y="358" fill="#5B21B6" font-family="Arial, sans-serif" font-size="17">▸ Ne délivre PAS le titre</text>
  <rect x="880" y="420" width="218" height="44" rx="10" fill="#EDE9FE"/>
  <text x="989" y="437" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="15" font-weight="700">Forme — ne délivre</text>
  <text x="989" y="457" text-anchor="middle" fill="#4C1D95" font-family="Arial, sans-serif" font-size="15">pas l'habilitation</text>

  <!-- Ligne de séparation visuelle Formateur -->
  <line x1="840" y1="160" x2="840" y2="490" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="850" y="340" fill="#A78BFA" font-family="Arial, sans-serif" font-size="22">≠</text>

  <!-- Barre bas -->
  <rect x="64" y="508" width="1072" height="116" rx="14" fill="#0C4A6E"/>
  <text x="600" y="540" text-anchor="middle" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="20" font-weight="700">Règle fondamentale</text>
  <text x="600" y="568" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="19">La formation est un prérequis indispensable — mais elle ne vaut pas habilitation à elle seule.</text>
  <text x="600" y="596" text-anchor="middle" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="18">L'habilitation est délivrée exclusivement par l'employeur, en fonction du poste, des risques et des tâches réelles.</text>
  <text x="600" y="618" text-anchor="middle" fill="#7DD3FC" font-family="Arial, sans-serif" font-size="17">En cas de mission hors périmètre : refuser, signaler, ne jamais improviser.</text>
</svg>
