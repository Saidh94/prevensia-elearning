<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#FFF7ED"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#FED7AA" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="36" font-weight="700">Contacts directs et indirects</text>
  <text x="600" y="126" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="20">Deux mécanismes distincts — même niveau de gravité potentiel.</text>

  <!-- Contact direct -->
  <rect x="64" y="148" width="514" height="400" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="64" y="148" width="514" height="64" rx="20" fill="#DC2626"/>
  <rect x="64" y="192" width="514" height="20" fill="#DC2626"/>
  <text x="321" y="191" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">CONTACT DIRECT</text>

  <text x="321" y="244" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="19" font-weight="700">Toucher une pièce normalement sous tension</text>

  <text x="88" y="292" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Conducteur nu, borne, pièce interne</text>
  <text x="88" y="330" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Coffret ouvert ou tableau non protégé</text>
  <text x="88" y="368" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Câble dont la gaine est endommagée</text>
  <text x="88" y="406" fill="#991B1B" font-family="Arial, sans-serif" font-size="21">✘  Fiche en cours de connexion</text>

  <rect x="88" y="430" width="466" height="50" rx="10" fill="#FEE2E2"/>
  <text x="321" y="451" text-anchor="middle" fill="#B91C1C" font-family="Arial, sans-serif" font-size="19" font-weight="700">Le danger est VISIBLE</text>
  <text x="321" y="471" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="17">mais pas toujours reconnu comme tel</text>

  <text x="321" y="524" text-anchor="middle" fill="#DC2626" font-family="Arial, sans-serif" font-size="20" font-weight="700">→ S'éloigner et signaler immédiatement</text>

  <!-- Séparateur -->
  <text x="622" y="368" text-anchor="middle" fill="#D1D5DB" font-family="Arial, sans-serif" font-size="52">≠</text>

  <!-- Contact indirect -->
  <rect x="622" y="148" width="514" height="400" rx="20" fill="#FFF7ED" stroke="#F97316" stroke-width="2.5"/>
  <rect x="622" y="148" width="514" height="64" rx="20" fill="#C2410C"/>
  <rect x="622" y="192" width="514" height="20" fill="#C2410C"/>
  <text x="879" y="191" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">CONTACT INDIRECT</text>

  <text x="879" y="244" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="19" font-weight="700">Toucher une masse devenue dangereuse par défaut</text>

  <text x="646" y="292" fill="#9A3412" font-family="Arial, sans-serif" font-size="21">✘  Carcasse de machine sous tension</text>
  <text x="646" y="330" fill="#9A3412" font-family="Arial, sans-serif" font-size="21">✘  Enveloppe métallique défectueuse</text>
  <text x="646" y="368" fill="#9A3412" font-family="Arial, sans-serif" font-size="21">✘  Châssis ou bâti d'équipement</text>
  <text x="646" y="406" fill="#9A3412" font-family="Arial, sans-serif" font-size="21">✘  Coffret métallique mal mis à la terre</text>

  <rect x="646" y="430" width="466" height="50" rx="10" fill="#FFEDD5"/>
  <text x="879" y="451" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="19" font-weight="700">Le danger est INVISIBLE</text>
  <text x="879" y="471" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17">l'équipement semble normal visuellement</text>

  <text x="879" y="524" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="20" font-weight="700">→ Picotement = danger — stop et alerte</text>

  <!-- Barre bas -->
  <rect x="64" y="566" width="1072" height="52" rx="14" fill="#7C2D12"/>
  <text x="600" y="589" text-anchor="middle" fill="#FFEDD5" font-family="Arial, sans-serif" font-size="18" font-weight="700">Message clé : un matériel d'apparence normale peut être sous tension à cause d'un défaut d'isolement.</text>
  <text x="600" y="610" text-anchor="middle" fill="#FED7AA" font-family="Arial, sans-serif" font-size="16">Le titulaire B0/H0 ne teste JAMAIS lui-même — il signale et s'écarte.</text>
</svg>
