<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#EFF6FF"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#BFDBFE" stroke-width="2"/>

  <text x="600" y="92" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="36" font-weight="700">Synthèse opérationnelle B0 / H0 / H0V</text>
  <text x="600" y="126" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20">Les 4 réflexes fondamentaux — NF C 18-510</text>

  <!-- Réflexe 1 : OBSERVER -->
  <rect x="64" y="148" width="248" height="230" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="188" cy="194" r="32" fill="#1D4ED8"/>
  <text x="188" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">1</text>
  <text x="188" y="252" text-anchor="middle" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="20" font-weight="700">OBSERVER</text>
  <text x="188" y="282" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">Analyser l'environnement</text>
  <text x="188" y="306" text-anchor="middle" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">avant toute action</text>
  <text x="188" y="356" text-anchor="middle" fill="#93C5FD" font-family="Arial, sans-serif" font-size="15" font-weight="700">Réflexe permanent</text>

  <!-- Réflexe 2 : RESPECTER -->
  <rect x="328" y="148" width="248" height="230" rx="16" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <circle cx="452" cy="194" r="32" fill="#15803D"/>
  <text x="452" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">2</text>
  <text x="452" y="252" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="20" font-weight="700">RESPECTER</text>
  <text x="452" y="282" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="17">Distances, balisage</text>
  <text x="452" y="306" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="17">et consignes</text>
  <text x="452" y="356" text-anchor="middle" fill="#86EFAC" font-family="Arial, sans-serif" font-size="15" font-weight="700">Sans exception</text>

  <!-- Réflexe 3 : NE PAS IMPROVISER -->
  <rect x="592" y="148" width="248" height="230" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <circle cx="716" cy="194" r="32" fill="#DC2626"/>
  <text x="716" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">3</text>
  <text x="716" y="252" text-anchor="middle" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="18" font-weight="700">NE PAS IMPROVISER</text>
  <text x="716" y="282" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="17">Jamais d'action électrique</text>
  <text x="716" y="306" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="17">même simple ou rapide</text>
  <text x="716" y="356" text-anchor="middle" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="15" font-weight="700">Règle absolue</text>

  <!-- Réflexe 4 : ALERTER -->
  <rect x="856" y="148" width="280" height="230" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <circle cx="996" cy="194" r="32" fill="#C2410C"/>
  <text x="996" y="202" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="26" font-weight="700">4</text>
  <text x="996" y="252" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="20" font-weight="700">ALERTER</text>
  <text x="996" y="282" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">Toute anomalie, tout doute</text>
  <text x="996" y="306" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">toute situation dégradée</text>
  <text x="996" y="356" text-anchor="middle" fill="#FED7AA" font-family="Arial, sans-serif" font-size="15" font-weight="700">Immédiatement</text>

  <!-- Bloc règles à retenir -->
  <rect x="64" y="398" width="1072" height="188" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="88" y="430" fill="#1E3A5F" font-family="Arial, sans-serif" font-size="19" font-weight="700">Règles essentielles :</text>
  <text x="88" y="462" fill="#374151" font-family="Arial, sans-serif" font-size="18">• B0/H0/H0V = opérations non électriques — jamais d'action sur l'installation</text>
  <text x="88" y="490" fill="#374151" font-family="Arial, sans-serif" font-size="18">• La formation ne vaut pas habilitation — c'est l'employeur qui délivre le titre</text>
  <text x="88" y="518" fill="#374151" font-family="Arial, sans-serif" font-size="18">• Le danger peut être invisible (défaut d'isolement, masse sous tension, arc HT)</text>
  <text x="88" y="546" fill="#374151" font-family="Arial, sans-serif" font-size="18">• L'humidité aggrave le risque — milieu humide = vigilance maximale</text>
  <text x="88" y="574" fill="#374151" font-family="Arial, sans-serif" font-size="18">• Protection collective d'abord — ne jamais contourner capots et balisage</text>

  <!-- Barre bas -->
  <rect x="64" y="604" width="1072" height="48" rx="14" fill="#1E3A5F"/>
  <text x="600" y="624" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="17" font-weight="700">Doute = arrêt immédiat · Anomalie = signalement · Hors périmètre = refus</text>
  <text x="600" y="644" text-anchor="middle" fill="#93C5FD" font-family="Arial, sans-serif" font-size="14">Ces réflexes protègent autant le salarié que les collègues et l'organisation.</text>
</svg>
