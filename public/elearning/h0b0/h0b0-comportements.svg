<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F8FAFC"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#E2E8F0" stroke-width="2"/>

  <text x="600" y="90" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="36" font-weight="700">Comportements autorisés et interdits</text>
  <text x="600" y="124" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="19">Habilitation H0 / B0 / H0V — ce qui est dans le périmètre et ce qui ne l'est jamais.</text>

  <!-- Colonne gauche : AUTORISÉ -->
  <rect x="64" y="148" width="514" height="390" rx="20" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
  <rect x="64" y="148" width="514" height="66" rx="20" fill="#15803D"/>
  <rect x="64" y="194" width="514" height="20" fill="#15803D"/>
  <text x="321" y="192" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">✓  AUTORISÉ</text>

  <text x="88" y="246" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  Circuler sur les cheminements prévus</text>
  <text x="88" y="282" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  Réaliser sa tâche non électrique définie</text>
  <text x="88" y="318" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  Respecter la signalisation et le balisage</text>
  <text x="88" y="354" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  Signaler toute anomalie à l'encadrement</text>
  <text x="88" y="390" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  S'arrêter si les protections ne sont plus</text>
  <text x="110" y="418" fill="#14532D" font-family="Arial, sans-serif" font-size="21">     conformes ou si le milieu devient douteux</text>
  <text x="88" y="454" fill="#14532D" font-family="Arial, sans-serif" font-size="21">✔  Attendre l'intervention d'un électricien</text>

  <rect x="88" y="478" width="466" height="42" rx="10" fill="#DCFCE7"/>
  <text x="321" y="505" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17" font-weight="700">Observer · Respecter · Signaler · S'arrêter</text>

  <!-- Séparateur -->
  <text x="604" y="360" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="48">|</text>

  <!-- Colonne droite : INTERDIT -->
  <rect x="622" y="148" width="514" height="390" rx="20" fill="#FEF2F2" stroke="#EF4444" stroke-width="2.5"/>
  <rect x="622" y="148" width="514" height="66" rx="20" fill="#DC2626"/>
  <rect x="622" y="194" width="514" height="20" fill="#DC2626"/>
  <text x="879" y="192" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">✗  INTERDIT</text>

  <text x="646" y="246" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Ouvrir armoire, coffret ou capot</text>
  <text x="646" y="282" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Toucher conducteurs, bornes, câbles</text>
  <text x="646" y="318" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Réarmer disjoncteur à répétition</text>
  <text x="646" y="354" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Réparer ou modifier un matériel</text>
  <text x="646" y="390" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Contourner un balisage ou obstacle</text>
  <text x="646" y="426" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Mesurer, consigner, dépanner</text>
  <text x="646" y="462" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="21">✘  Entrer dans un local réservé sans cadre</text>

  <rect x="646" y="478" width="466" height="42" rx="10" fill="#FEE2E2"/>
  <text x="879" y="505" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="17" font-weight="700">Urgence, gain de temps, habitude : aucune excuse</text>

  <!-- Barre bas -->
  <rect x="64" y="554" width="1072" height="68" rx="14" fill="#0F172A"/>
  <text x="600" y="580" text-anchor="middle" fill="#FDE68A" font-family="Arial, sans-serif" font-size="19" font-weight="700">Règle opérationnelle</text>
  <text x="600" y="606" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">Ce qui n'est pas explicitement autorisé dans la mission et l'habilitation est interdit — ou doit être vérifié au préalable.</text>
</svg>
