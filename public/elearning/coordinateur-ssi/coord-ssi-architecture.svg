<svg viewBox="0 0 920 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748b"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#ea580c"/>
    </marker>
  </defs>
  <!-- Background -->
  <rect width="920" height="520" fill="#f8fafc" rx="12"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Architecture du SSI — NF S 61-931</text>

  <!-- SDI zone -->
  <rect x="12" y="45" width="220" height="440" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="10"/>
  <text x="122" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">SDI</text>
  <text x="122" y="82" text-anchor="middle" font-size="9.5" fill="#3b82f6">Système de Détection Incendie</text>

  <!-- Détecteurs automatiques -->
  <rect x="24" y="92" width="196" height="218" fill="#dbeafe" stroke="#93c5fd" stroke-width="1" rx="7"/>
  <text x="122" y="110" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Détecteurs Automatiques</text>
  <!-- DA Optique -->
  <circle cx="50" cy="133" r="9" fill="#3b82f6"/>
  <text x="50" y="137" text-anchor="middle" font-size="9" fill="white" font-weight="700">DA</text>
  <text x="68" y="130" font-size="10" fill="#1e40af" font-weight="600">Optique</text>
  <text x="68" y="142" font-size="9" fill="#475569">(fumée — NF EN 54-7)</text>
  <!-- DA Thermique -->
  <circle cx="50" cy="168" r="9" fill="#3b82f6"/>
  <text x="50" y="172" text-anchor="middle" font-size="9" fill="white" font-weight="700">DA</text>
  <text x="68" y="165" font-size="10" fill="#1e40af" font-weight="600">Thermique</text>
  <text x="68" y="177" font-size="9" fill="#475569">(chaleur — NF EN 54-5)</text>
  <!-- DA Thermoveloci -->
  <circle cx="50" cy="203" r="9" fill="#3b82f6"/>
  <text x="50" y="207" text-anchor="middle" font-size="9" fill="white" font-weight="700">DA</text>
  <text x="68" y="200" font-size="10" fill="#1e40af" font-weight="600">Thermoveloci</text>
  <text x="68" y="212" font-size="9" fill="#475569">(vitesse montée T°)</text>
  <!-- DA Flamme -->
  <circle cx="50" cy="238" r="9" fill="#3b82f6"/>
  <text x="50" y="242" text-anchor="middle" font-size="9" fill="white" font-weight="700">DA</text>
  <text x="68" y="235" font-size="10" fill="#1e40af" font-weight="600">Flamme</text>
  <text x="68" y="247" font-size="9" fill="#475569">(UV/IR — zones spéciales)</text>
  <!-- DA Aspiration -->
  <circle cx="50" cy="273" r="9" fill="#3b82f6"/>
  <text x="50" y="277" text-anchor="middle" font-size="9" fill="white" font-weight="700">DA</text>
  <text x="68" y="270" font-size="10" fill="#1e40af" font-weight="600">Aspiration (ASD)</text>
  <text x="68" y="282" font-size="9" fill="#475569">(air aspiré, haute sensib.)</text>

  <!-- DM Déclencheur manuel -->
  <rect x="24" y="324" width="196" height="60" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" rx="7"/>
  <rect x="36" y="338" width="24" height="30" fill="#ef4444" rx="3"/>
  <text x="48" y="354" text-anchor="middle" font-size="8" fill="white" font-weight="700">DM</text>
  <text x="90" y="350" font-size="10" fill="#991b1b" font-weight="600">Déclencheur Manuel</text>
  <text x="90" y="363" font-size="9" fill="#7f1d1d">(bris de glace — NF EN 54-11)</text>

  <!-- ECS box -->
  <rect x="24" y="398" width="196" height="75" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" rx="7"/>
  <text x="122" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">ECS</text>
  <text x="122" y="434" text-anchor="middle" font-size="9" fill="#0369a1">Équipement de Contrôle</text>
  <text x="122" y="446" text-anchor="middle" font-size="9" fill="#0369a1">et de Signalisation</text>
  <text x="122" y="460" text-anchor="middle" font-size="8.5" fill="#7dd3fc">(NF EN 54-2 / NF S 61-950)</text>

  <!-- Arrow SDI → CMSI -->
  <line x1="232" y1="260" x2="308" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SMSI zone -->
  <rect x="310" y="45" width="590" height="440" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="10"/>
  <text x="605" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">SMSI</text>
  <text x="605" y="82" text-anchor="middle" font-size="9.5" fill="#ea580c">Système de Mise en Sécurité Incendie</text>

  <!-- CMSI box -->
  <rect x="322" y="95" width="200" height="230" fill="#fed7aa" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="422" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">CMSI</text>
  <text x="422" y="130" text-anchor="middle" font-size="9" fill="#c2410c">Centralisateur de Mise en</text>
  <text x="422" y="142" text-anchor="middle" font-size="9" fill="#c2410c">Sécurité Incendie (NF S 61-934)</text>
  <!-- US -->
  <rect x="334" y="152" width="176" height="38" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" rx="5"/>
  <text x="422" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">US — Unité de Signalisation</text>
  <text x="422" y="182" text-anchor="middle" font-size="8.5" fill="#78350f">Affichage état zones/DAS</text>
  <!-- UCMC -->
  <rect x="334" y="198" width="176" height="38" fill="#fef3c7" stroke="#fbbf24" stroke-width="1" rx="5"/>
  <text x="422" y="214" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">UCMC — Cmd Manuelle</text>
  <text x="422" y="228" text-anchor="middle" font-size="8.5" fill="#78350f">Par Zone de Mise en Sécurité</text>
  <!-- UGA -->
  <rect x="334" y="244" width="176" height="38" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5" rx="5"/>
  <text x="422" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">UGA — Unité Gest. Alarme</text>
  <text x="422" y="274" text-anchor="middle" font-size="8.5" fill="#78350f">Niveaux 1 (restreinte) / 2 (gén.)</text>

  <!-- UGA → DVDA arrow -->
  <line x1="422" y1="282" x2="422" y2="370" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-o)" stroke-dasharray="4,3"/>
  <!-- DVDA -->
  <rect x="340" y="370" width="164" height="50" fill="#fef3c7" stroke="#f97316" stroke-width="1" rx="6"/>
  <text x="422" y="390" text-anchor="middle" font-size="10" font-weight="600" fill="#9a3412">DVDA / Alarme Sonore</text>
  <text x="422" y="404" text-anchor="middle" font-size="8.5" fill="#92400e">Diffuseurs sonores + Voyants</text>
  <text x="422" y="416" text-anchor="middle" font-size="8" fill="#b45309">(NF S 61-936 / NF S 61-966)</text>

  <!-- AES -->
  <rect x="322" y="434" width="200" height="39" fill="#d1fae5" stroke="#34d399" stroke-width="1" rx="6"/>
  <text x="422" y="450" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">AES — Alim. Électrique Sécu.</text>
  <text x="422" y="464" text-anchor="middle" font-size="8.5" fill="#047857">Batteries + Groupe électrogène (NF S 61-940)</text>

  <!-- Arrow CMSI → DAS -->
  <line x1="522" y1="210" x2="570" y2="210" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- DAS zone -->
  <rect x="572" y="95" width="316" height="390" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" rx="8"/>
  <text x="730" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">DAS</text>
  <text x="730" y="130" text-anchor="middle" font-size="9.5" fill="#e11d48">Dispositifs Actionnés de Sécurité</text>
  <text x="730" y="143" text-anchor="middle" font-size="8.5" fill="#f43f5e">(NF S 61-937)</text>

  <!-- DAS items -->
  <!-- Porte CF -->
  <rect x="584" y="155" width="292" height="42" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="5"/>
  <text x="730" y="172" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">🚪 Porte Coupe-Feu (PCF)</text>
  <text x="730" y="186" text-anchor="middle" font-size="8.5" fill="#be123c">Fermeture auto • Compartimentage • EI 30/60/90/120</text>
  <!-- Volet désenf -->
  <rect x="584" y="205" width="292" height="42" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="5"/>
  <text x="730" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">🌬 Volet de Désenfumage</text>
  <text x="730" y="236" text-anchor="middle" font-size="8.5" fill="#be123c">Ouverture/fermeture • ZF • Naturel ou mécanique</text>
  <!-- Clapet CF -->
  <rect x="584" y="255" width="292" height="42" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="5"/>
  <text x="730" y="272" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">⚡ Clapet Coupe-Feu (CCF)</text>
  <text x="730" y="286" text-anchor="middle" font-size="8.5" fill="#be123c">Dans gaines CVC • Limite propagation gaz chauds</text>
  <!-- Issue secours -->
  <rect x="584" y="305" width="292" height="42" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="5"/>
  <text x="730" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">🔓 Déverrouillage Issues</text>
  <text x="730" y="336" text-anchor="middle" font-size="8.5" fill="#be123c">Portes secours • Ventouses EM • Cheminement évacuation</text>
  <!-- CTA / Ascenseurs -->
  <rect x="584" y="355" width="292" height="42" fill="#ffe4e6" stroke="#fda4af" stroke-width="1" rx="5"/>
  <text x="730" y="372" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">⏹ Arrêts Techniques</text>
  <text x="730" y="386" text-anchor="middle" font-size="8.5" fill="#be123c">CTA, ascenseurs, process — Mise en position sécurité</text>
  <!-- DCT/DCM -->
  <rect x="584" y="405" width="292" height="42" fill="#fee2e2" stroke="#fca5a5" stroke-width="1" rx="5"/>
  <text x="730" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#9f1239">📡 DCT / DCM</text>
  <text x="730" y="436" text-anchor="middle" font-size="8.5" fill="#be123c">Tableaux report / Cdes manuelles déportées</text>

  <!-- Legend -->
  <rect x="322" y="478" width="575" height="22" fill="#f1f5f9" rx="5"/>
  <text x="609" y="493" text-anchor="middle" font-size="8.5" fill="#475569">ZDA = Zone Détection Automatique · ZDM = Zone Détection Manuelle   •   ZC = Zone de Compartimentage   •   ZF = Zone de Désenfumage   •   ZA = Zone d'Alarme</text>
</svg>