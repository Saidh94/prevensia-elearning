<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="900" height="420" fill="#f8fafc" rx="12"/>
  <text x="450" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Missions du Coordinateur SSI — 4 phases (NF S 61-931 §5.3)</text>
  <text x="450" y="47" text-anchor="middle" font-size="9.5" fill="#64748b">Le CSSI pilote la cohérence du SSI de la conception à l'exploitation · il ne réalise pas la maintenance</text>

  <!-- Timeline arrows -->
  <line x1="30" y1="95" x2="870" y2="95" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="870,89 882,95 870,101" fill="#cbd5e1"/>

  <!-- Phase 1 - CONCEPTION -->
  <circle cx="110" cy="95" r="18" fill="#7c3aed"/>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="white" font-weight="700">1</text>
  <rect x="18" y="118" width="184" height="282" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="110" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">CONCEPTION</text>
  <text x="110" y="155" text-anchor="middle" font-size="9" fill="#7c3aed">Phase projet / avant travaux</text>
  <line x1="30" y1="162" x2="194" y2="162" stroke="#ddd6fe" stroke-width="1"/>
  <!-- Items -->
  <text x="30" y="180" font-size="9.5" fill="#4c1d95" font-weight="600">📋 CCF — Cahier des Charges</text>
  <text x="30" y="193" font-size="8.5" fill="#5b21b6">Fonctionnel SSI</text>
  <text x="30" y="207" font-size="8" fill="#6d28d9">Fonctions, scénarios, exigences</text>

  <text x="30" y="227" font-size="9.5" fill="#4c1d95" font-weight="600">📊 Matrice de corrélation</text>
  <text x="30" y="240" font-size="8" fill="#6d28d9">Qui déclenche quoi / temporisations</text>

  <text x="30" y="260" font-size="9.5" fill="#4c1d95" font-weight="600">🏗 Architecture SSI</text>
  <text x="30" y="273" font-size="8" fill="#6d28d9">Catégorie A→E, équipements</text>
  <text x="30" y="285" font-size="8" fill="#6d28d9">Choix SDI/SMSI/DAS</text>

  <text x="30" y="305" font-size="9.5" fill="#4c1d95" font-weight="600">📐 Plans de principe</text>
  <text x="30" y="318" font-size="8" fill="#6d28d9">ZDA/ZDM, ZF, ZC</text>

  <rect x="26" y="366" width="176" height="28" fill="#7c3aed" rx="5"/>
  <text x="114" y="384" text-anchor="middle" font-size="8.5" fill="white" font-weight="700">Livrable : CCF + Matrice</text>

  <!-- Phase 2 - RÉALISATION -->
  <circle cx="340" cy="95" r="18" fill="#0369a1"/>
  <text x="340" y="100" text-anchor="middle" font-size="12" fill="white" font-weight="700">2</text>
  <rect x="248" y="118" width="184" height="282" fill="#eff6ff" stroke="#0369a1" stroke-width="1.5" rx="8"/>
  <text x="340" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">RÉALISATION</text>
  <text x="340" y="155" text-anchor="middle" font-size="9" fill="#0369a1">Pendant les travaux</text>
  <line x1="260" y1="162" x2="424" y2="162" stroke="#bae6fd" stroke-width="1"/>

  <text x="260" y="180" font-size="9.5" fill="#0c4a6e" font-weight="600">🔍 Vérification conformité</text>
  <text x="260" y="193" font-size="8" fill="#0369a1">Câblage, implantation, interfaces</text>

  <text x="260" y="213" font-size="9.5" fill="#0c4a6e" font-weight="600">👷 Coordination installateurs</text>
  <text x="260" y="226" font-size="8" fill="#0369a1">SSI, élec, CVC, désenfumage</text>
  <text x="260" y="238" font-size="8" fill="#0369a1">ascenseurs, process</text>

  <text x="260" y="258" font-size="9.5" fill="#0c4a6e" font-weight="600">🧪 Essais fonctionnels</text>
  <text x="260" y="271" font-size="8" fill="#0369a1">Détection → CMSI → DAS</text>
  <text x="260" y="283" font-size="8" fill="#0369a1">Vérification des temporisations</text>

  <text x="260" y="303" font-size="9.5" fill="#0c4a6e" font-weight="600">📝 Mise à jour CCF/Matrice</text>
  <text x="260" y="316" font-size="8" fill="#0369a1">Si modifications en cours de chantier</text>

  <rect x="256" y="366" width="176" height="28" fill="#0369a1" rx="5"/>
  <text x="344" y="384" text-anchor="middle" font-size="8.5" fill="white" font-weight="700">Livrable : PV d'essais</text>

  <!-- Phase 3 - RÉCEPTION -->
  <circle cx="570" cy="95" r="18" fill="#059669"/>
  <text x="570" y="100" text-anchor="middle" font-size="12" fill="white" font-weight="700">3</text>
  <rect x="478" y="118" width="184" height="282" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" rx="8"/>
  <text x="570" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#064e3b">RÉCEPTION</text>
  <text x="570" y="155" text-anchor="middle" font-size="9" fill="#059669">Avant mise en service</text>
  <line x1="490" y1="162" x2="654" y2="162" stroke="#a7f3d0" stroke-width="1"/>

  <text x="490" y="180" font-size="9.5" fill="#064e3b" font-weight="600">📋 Essais de réception</text>
  <text x="490" y="193" font-size="8" fill="#059669">Tests complets du SSI installé</text>
  <text x="490" y="205" font-size="8" fill="#059669">Tout le système en conditions réelles</text>

  <text x="490" y="225" font-size="9.5" fill="#064e3b" font-weight="600">📁 Dossier d'Identité SSI (DIS)</text>
  <text x="490" y="238" font-size="8" fill="#059669">Notice descriptive, plans AS-BUILT</text>
  <text x="490" y="250" font-size="8" fill="#059669">CCF final, matrice, fiches DAS</text>

  <text x="490" y="270" font-size="9.5" fill="#064e3b" font-weight="600">🏛 Commission de sécurité</text>
  <text x="490" y="283" font-size="8" fill="#059669">Présentation du DIS, réponse</text>
  <text x="490" y="295" font-size="8" fill="#059669">aux questions techniques</text>

  <text x="490" y="315" font-size="9.5" fill="#064e3b" font-weight="600">✅ Levée des réserves</text>
  <text x="490" y="328" font-size="8" fill="#059669">Suivi correction non-conformités</text>

  <rect x="486" y="366" width="176" height="28" fill="#059669" rx="5"/>
  <text x="574" y="384" text-anchor="middle" font-size="8.5" fill="white" font-weight="700">Livrable : DIS complet</text>

  <!-- Phase 4 - EXPLOITATION -->
  <circle cx="800" cy="95" r="18" fill="#c2410c"/>
  <text x="800" y="100" text-anchor="middle" font-size="12" fill="white" font-weight="700">4</text>
  <rect x="708" y="118" width="184" height="282" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" rx="8"/>
  <text x="800" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">EXPLOITATION</text>
  <text x="800" y="155" text-anchor="middle" font-size="9" fill="#c2410c">Vie du bâtiment</text>
  <line x1="720" y1="162" x2="884" y2="162" stroke="#fed7aa" stroke-width="1"/>

  <text x="720" y="180" font-size="9.5" fill="#7c2d12" font-weight="600">📂 Mise à jour DIS</text>
  <text x="720" y="193" font-size="8" fill="#c2410c">Après toute modification du SSI</text>

  <text x="720" y="213" font-size="9.5" fill="#7c2d12" font-weight="600">🔧 Suivi des travaux</text>
  <text x="720" y="226" font-size="8" fill="#c2410c">Impact sur SSI, mesures comp.</text>
  <text x="720" y="238" font-size="8" fill="#c2410c">Coordination installateurs</text>

  <text x="720" y="258" font-size="9.5" fill="#7c2d12" font-weight="600">🏛 Interface autorités</text>
  <text x="720" y="271" font-size="8" fill="#c2410c">Commission sécu, SDIS, bureau</text>
  <text x="720" y="283" font-size="8" fill="#c2410c">de contrôle — levée réserves</text>

  <text x="720" y="303" font-size="9.5" fill="#7c2d12" font-weight="600">⚠ Connaît les règles expl.</text>
  <text x="720" y="316" font-size="8" fill="#c2410c">NF S 61-933 : sait ce que le</text>
  <text x="720" y="328" font-size="8" fill="#c2410c">mainteneur doit faire / vérifier</text>

  <rect x="716" y="366" width="176" height="28" fill="#c2410c" rx="5"/>
  <text x="804" y="384" text-anchor="middle" font-size="8.5" fill="white" font-weight="700">DIS à jour en permanence</text>
</svg>