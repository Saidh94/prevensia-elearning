  <text x="430" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Lecture de la matrice — Rôle du CSSI</text>

  <circle cx="30" cy="382" r="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="30" y="386" text-anchor="middle" font-size="10" fill="#15803d">✓</text>
  <text x="47" y="386" font-size="9" fill="#1e293b">Action déclenchée — le DAS passe en position de sécurité</text>

  <text x="350" y="386" font-size="18" fill="#94a3b8">—</text>
  <text x="368" y="386" font-size="9" fill="#1e293b">Pas d'action sur ce DAS pour cette zone</text>

  <text x="25" y="408" font-size="9" fill="#475569">• Le CSSI rédige cette matrice dans le CCF (Cahier des Charges Fonctionnel SSI) en phase de CONCEPTION</text>
  <text x="25" y="424" font-size="9" fill="#475569">• Elle définit exactement quels DAS sont commandés pour chaque scénario de détection (zone + type de détecteur)</text>
  <text x="25" y="440" font-size="9" fill="#475569">• Les temporisations (t = 0 s, 30 s, 3 min…) sont des paramètres critiques : elles définissent le délai d'actionnement du DAS après déclenchement</text>
  <text x="25" y="456" font-size="9" fill="#475569">• Le CSSI vérifie que la matrice réelle (programmée dans le CMSI) correspond à la matrice du CCF lors des essais fonctionnels en phase RÉALISATION</text>
  <text x="25" y="472" font-size="9" font-weight="600" fill="#c2410c">⚠ Le CSSI conçoit et vérifie la matrice — c'est l'installateur SSI qui la programme dans le CMSI</text>
