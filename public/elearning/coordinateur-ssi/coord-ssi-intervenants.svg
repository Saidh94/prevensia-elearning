<svg viewBox="0 0 860 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="860" height="460" fill="#f8fafc" rx="12"/>
  <text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">CSSI — Coordination des Intervenants et Gestion des Travaux</text>
  <text x="430" y="44" text-anchor="middle" font-size="9.5" fill="#64748b">Le CSSI orchestre · il ne réalise pas les travaux ni la maintenance</text>

  <!-- CSSI center -->
  <circle cx="430" cy="220" r="58" fill="#1e293b"/>
  <text x="430" y="210" text-anchor="middle" font-size="13" fill="white" font-weight="700">CSSI</text>
  <text x="430" y="226" text-anchor="middle" font-size="9" fill="#94a3b8">Coordinateur</text>
  <text x="430" y="240" text-anchor="middle" font-size="9" fill="#94a3b8">SSI</text>

  <!-- Entity: Installateurs SSI (top left) -->
  <rect x="40" y="58" width="180" height="88" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
  <text x="130" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#1d4ed8">Installateurs SSI</text>
  <text x="130" y="93" text-anchor="middle" font-size="8.5" fill="#1e40af">Entreprise agréée</text>
  <text x="50" y="110" font-size="8" fill="#3b82f6">• Programme CMSI / matrice</text>
  <text x="50" y="122" font-size="8" fill="#3b82f6">• Câble DAS / détecteurs</text>
  <text x="50" y="134" font-size="8" fill="#3b82f6">• Essais fonctionnels</text>
  <!-- Arrow -->
  <line x1="218" y1="115" x2="375" y2="175" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="375" y1="175" x2="218" y2="115" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Entity: Corps d'état (top center) -->
  <rect x="280" y="58" width="300" height="88" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" rx="8"/>
  <text x="430" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#c2410c">Corps d'état BTP</text>
  <text x="430" y="93" text-anchor="middle" font-size="8.5" fill="#ea580c">impactant le SSI</text>
  <text x="290" y="110" font-size="8" fill="#c2410c">• Électriciens (alimentations équipements)</text>
  <text x="290" y="122" font-size="8" fill="#c2410c">• Cloisonneurs (compartimentage, PCF)</text>
  <text x="290" y="134" font-size="8" fill="#c2410c">• CVC / Désenfumage / Ascensoristes</text>
  <line x1="430" y1="146" x2="430" y2="162" stroke="#f97316" stroke-width="1.5" marker-end="url(#ao)"/>

  <!-- Entity: Bureau de contrôle (top right) -->
  <rect x="640" y="58" width="180" height="88" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="8"/>
  <text x="730" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Bureau de Contrôle</text>
  <text x="730" y="93" text-anchor="middle" font-size="8.5" fill="#16a34a">Organisme accrédité</text>
  <text x="650" y="110" font-size="8" fill="#15803d">• Vérification périodique SSI</text>
  <text x="650" y="122" font-size="8" fill="#15803d">• Rapport de non-conformités</text>
  <text x="650" y="134" font-size="8" fill="#15803d">• Suivi levée de réserves</text>
  <line x1="642" y1="115" x2="485" y2="175" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- Entity: Commission de sécurité (bottom left) -->
  <rect x="40" y="302" width="180" height="88" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="8"/>
  <text x="130" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">Commission Sécu.</text>
  <text x="130" y="337" text-anchor="middle" font-size="8.5" fill="#dc2626">Sous-comm. départ.</text>
  <text x="50" y="354" font-size="8" fill="#ef4444">• Visite ERP périodique</text>
  <text x="50" y="366" font-size="8" fill="#ef4444">• Avis favorable / défavorable</text>
  <text x="50" y="378" font-size="8" fill="#ef4444">• Consulte DIS et registre</text>
  <line x1="218" y1="335" x2="375" y2="265" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Entity: SDIS (bottom center) -->
  <rect x="280" y="320" width="300" height="70" fill="#fef9c3" stroke="#eab308" stroke-width="1.5" rx="8"/>
  <text x="430" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#713f12">SDIS / Sapeurs-Pompiers</text>
  <text x="290" y="360" font-size="8" fill="#854d0e">• Visites de prévention incendie</text>
  <text x="290" y="374" font-size="8" fill="#854d0e">• Accès locaux SSI en intervention · Plans à disposition</text>
  <line x1="430" y1="320" x2="430" y2="278" stroke="#eab308" stroke-width="1.5" marker-end="url(#ay)"/>

  <!-- Entity: Maître d'ouvrage / Exploitant (bottom right) -->
  <rect x="640" y="302" width="180" height="88" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="730" y="322" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">Maître d'Ouvrage</text>
  <text x="730" y="337" text-anchor="middle" font-size="8.5" fill="#6d28d9">/ Exploitant</text>
  <text x="650" y="354" font-size="8" fill="#7c3aed">• Mandante le CSSI (mission)</text>
  <text x="650" y="366" font-size="8" fill="#7c3aed">• Responsable final du SSI</text>
  <text x="650" y="378" font-size="8" fill="#7c3aed">• Détient et conserve le DIS</text>
  <line x1="642" y1="335" x2="485" y2="265" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <!-- Legend arrows in defs -->
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3b82f6"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#f97316"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#22c55e"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#ef4444"/></marker>
    <marker id="ay" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#eab308"/></marker>
    <marker id="av" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#7c3aed"/></marker>
  </defs>

  <!-- Bottom note -->
  <rect x="12" y="402" width="836" height="48" fill="#f1f5f9" stroke="#e2e8f0" rx="6"/>
  <text x="430" y="420" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e293b">Ce que le CSSI fait / ce qu'il ne fait PAS</text>
  <text x="430" y="438" text-anchor="middle" font-size="8.5" fill="#475569">✓ Coordonne, vérifie, valide, documente     ✗ N'exécute pas les travaux     ✗ Ne réalise pas la maintenance     ✗ N'est pas le SSIAP (agent de sécurité)</text>
</svg>