<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="300" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="#1a1a1a">LE TÉTRAÈDRE DU FEU</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#666">4 conditions simultanées — Supprimer une face = extinction</text>

  <!-- Fond sombre circulaire -->
  <circle cx="300" cy="215" r="150" fill="#1a0a00"/>

  <!-- Anneaux animés — flamme pulsante -->
  <circle cx="300" cy="215" r="108" fill="#b32200" opacity="0.18">
    <animate attributeName="r" values="90;122;90" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.34;0.18" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="215" r="76" fill="#e64400" opacity="0.32">
    <animate attributeName="r" values="62;90;62" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.32;0.52;0.32" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="215" r="48" fill="#ff7700" opacity="0.58">
    <animate attributeName="r" values="38;58;38" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="215" r="26" fill="#ffbb00" opacity="0.88">
    <animate attributeName="r" values="18;34;18" dur="0.95s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="215" r="11" fill="#fffaaa" opacity="0.97"/>

  <!-- Flamme centrale -->
  <text x="300" y="222" text-anchor="middle" font-size="22" font-weight="900" fill="#1a0800">🔥</text>

  <!-- ── 4 faces du tétraèdre ── -->

  <!-- HAUT : Combustible -->
  <line x1="300" y1="82" x2="300" y2="128" stroke="#cc2200" stroke-width="2" stroke-dasharray="5,3" opacity="0.8"/>
  <rect x="194" y="46" width="212" height="40" rx="8" fill="#cc2200"/>
  <text x="300" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Combustible</text>
  <text x="300" y="79" text-anchor="middle" font-size="10" fill="#ffd" font-style="italic">bois · papier · textiles · liquides · gaz</text>
  <!-- Méthode extinction -->
  <rect x="218" y="88" width="164" height="18" rx="4" fill="#1a5c1a"/>
  <text x="300" y="101" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✂  Extinction : soustraire le combustible</text>

  <!-- DROITE : Comburant O2 -->
  <line x1="430" y1="166" x2="388" y2="196" stroke="#1a5c1a" stroke-width="2" stroke-dasharray="5,3" opacity="0.8"/>
  <rect x="436" y="136" width="154" height="40" rx="8" fill="#1a5c1a"/>
  <text x="513" y="153" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Comburant</text>
  <text x="513" y="168" text-anchor="middle" font-size="10" fill="#cfc" font-style="italic">Oxygène de l'air (≥ 14 %)</text>
  <rect x="440" y="178" width="146" height="18" rx="4" fill="#1a4e8c"/>
  <text x="513" y="191" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✂  Étouffement — souffler / couvrir</text>

  <!-- BAS-DROITE : Énergie d'activation -->
  <line x1="430" y1="264" x2="388" y2="234" stroke="#8b5e00" stroke-width="2" stroke-dasharray="5,3" opacity="0.8"/>
  <rect x="436" y="272" width="154" height="40" rx="8" fill="#8b5e00"/>
  <text x="513" y="289" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Énergie d'activation</text>
  <text x="513" y="304" text-anchor="middle" font-size="10" fill="#fed" font-style="italic">Chaleur · étincelle · flamme</text>
  <rect x="440" y="314" width="146" height="18" rx="4" fill="#1a4e8c"/>
  <text x="513" y="327" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✂  Refroidissement — eau</text>

  <!-- BAS-GAUCHE : Réaction en chaîne -->
  <line x1="170" y1="264" x2="212" y2="234" stroke="#5a1a8c" stroke-width="2" stroke-dasharray="5,3" opacity="0.8"/>
  <rect x="10" y="272" width="156" height="40" rx="8" fill="#5a1a8c"/>
  <text x="88" y="289" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Réaction en chaîne</text>
  <text x="88" y="304" text-anchor="middle" font-size="10" fill="#ddf" font-style="italic">Propagation des radicaux libres</text>
  <rect x="14" y="314" width="148" height="18" rx="4" fill="#1a4e8c"/>
  <text x="88" y="327" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">✂  Inhibition — poudre BC/ABC</text>

  <!-- ── Bande extinction ── -->
  <rect x="10" y="358" width="580" height="56" rx="8" fill="#1a2e6e"/>
  <text x="300" y="377" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">4 MÉTHODES D'EXTINCTION</text>
  <text x="75"  y="398" text-anchor="middle" font-size="11" fill="#9ec8ff">Soustraire</text>
  <text x="75"  y="410" text-anchor="middle" font-size="10" fill="#7ab" font-style="italic">ôter le combustible</text>
  <line x1="136" y1="370" x2="136" y2="412" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="213" y="398" text-anchor="middle" font-size="11" fill="#9effc0">Étouffer</text>
  <text x="213" y="410" text-anchor="middle" font-size="10" fill="#7ab" font-style="italic">priver d'oxygène</text>
  <line x1="280" y1="370" x2="280" y2="412" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="370" y="398" text-anchor="middle" font-size="11" fill="#fed890">Refroidir</text>
  <text x="370" y="410" text-anchor="middle" font-size="10" fill="#7ab" font-style="italic">abaisser la température</text>
  <line x1="448" y1="370" x2="448" y2="412" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
  <text x="530" y="398" text-anchor="middle" font-size="11" fill="#ddbfff">Inhiber</text>
  <text x="530" y="410" text-anchor="middle" font-size="10" fill="#7ab" font-style="italic">casser la réaction</text>

</svg>
