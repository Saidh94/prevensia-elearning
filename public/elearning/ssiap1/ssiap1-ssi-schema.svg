<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="bg-ssi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e4eaf8"/>
    </linearGradient>
    <linearGradient id="detect-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5496"/>
      <stop offset="100%" stop-color="#1266b8"/>
    </linearGradient>
    <linearGradient id="cmsi-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e5a"/>
      <stop offset="100%" stop-color="#243870"/>
    </linearGradient>
    <linearGradient id="das-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3200"/>
      <stop offset="100%" stop-color="#a04000"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bg-ssi)" rx="12"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial,sans-serif" fill="#1a2e5a">SYSTÈME DE SÉCURITÉ INCENDIE (SSI)</text>
  <text x="320" y="44" text-anchor="middle" font-size="10" font-family="Arial,sans-serif" fill="#4060a0">SDI (Détection) + SMSI (Mise en Sécurité) — Catégories A à E — NF S 61-930</text>
  <line x1="40" y1="52" x2="600" y2="52" stroke="#c0cce0" stroke-width="1"/>

  <!-- ══ TOP: INPUTS ══ -->
  <!-- DAI -->
  <rect x="50" y="64" width="200" height="68" rx="8" fill="url(#detect-g)"/>
  <text x="150" y="85" text-anchor="middle" font-size="9.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700" letter-spacing="1">DAI</text>
  <text x="150" y="100" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial,sans-serif" fill="white">Détecteurs Automatiques</text>
  <text x="150" y="117" text-anchor="middle" font-size="9" font-family="Arial,sans-serif" fill="#b8d0ff">Optique · Ionique · Thermique · Flammes</text>

  <!-- DM — with blinking alert dot -->
  <rect x="390" y="64" width="200" height="68" rx="8" fill="url(#detect-g)"/>
  <text x="490" y="85" text-anchor="middle" font-size="9.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700" letter-spacing="1">DM</text>
  <text x="490" y="100" text-anchor="middle" font-size="12" font-weight="bold" font-family="Arial,sans-serif" fill="white">Déclencheurs Manuels</text>
  <text x="490" y="117" text-anchor="middle" font-size="9" font-family="Arial,sans-serif" fill="#b8d0ff">Boîtiers rouges bris de glace · ≤ 40 m</text>
  <!-- Blinking red dot on DM -->
  <circle cx="570" cy="73" r="7" fill="#ff2200">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Label: SDI bracket -->
  <rect x="28" y="60" width="14" height="76" rx="4" fill="#1a5496"/>
  <text x="35" y="104" text-anchor="middle" font-size="8" font-weight="bold" font-family="Arial,sans-serif" fill="white" transform="rotate(-90,35,104)">SDI</text>
  <rect x="598" y="60" width="14" height="76" rx="4" fill="#1a5496"/>
  <text x="605" y="104" text-anchor="middle" font-size="8" font-weight="bold" font-family="Arial,sans-serif" fill="white" transform="rotate(90,605,104)">SDI</text>

  <!-- Converging arrows to CMSI -->
  <line x1="150" y1="132" x2="150" y2="158" stroke="#4070b8" stroke-width="2"/>
  <line x1="150" y1="158" x2="294" y2="184" stroke="#4070b8" stroke-width="2"/>
  <line x1="490" y1="132" x2="490" y2="158" stroke="#4070b8" stroke-width="2"/>
  <line x1="490" y1="158" x2="346" y2="184" stroke="#4070b8" stroke-width="2"/>
  <polygon points="314,181 326,181 320,192" fill="#4070b8"/>

  <!-- ══ CENTER: CMSI ══ -->
  <rect x="190" y="192" width="260" height="72" rx="8" fill="url(#cmsi-g)"/>
  <rect x="190" y="192" width="260" height="72" rx="8" fill="none" stroke="#6080c0" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="320" y="213" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700" letter-spacing="2">CMSI</text>
  <text x="320" y="229" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial,sans-serif" fill="white">Centrale de Mise en Sécurité</text>
  <text x="320" y="247" text-anchor="middle" font-size="9" font-family="Arial,sans-serif" fill="#b8ccff">Reçoit · Traite · Commande les DAS</text>

  <!-- Arrows CMSI → DAS (4 outputs) -->
  <line x1="230" y1="264" x2="130" y2="302" stroke="#a05020" stroke-width="2"/>
  <polygon points="124,297 136,297 130,308" fill="#a05020"/>
  <line x1="280" y1="264" x2="252" y2="302" stroke="#a05020" stroke-width="2"/>
  <polygon points="246,297 258,297 252,308" fill="#a05020"/>
  <line x1="360" y1="264" x2="388" y2="302" stroke="#a05020" stroke-width="2"/>
  <polygon points="382,297 394,297 388,308" fill="#a05020"/>
  <line x1="410" y1="264" x2="510" y2="302" stroke="#a05020" stroke-width="2"/>
  <polygon points="504,297 516,297 510,308" fill="#a05020"/>

  <!-- ══ BOTTOM: DAS outputs ══ -->
  <!-- DAS 1: Portes coupe-feu -->
  <rect x="55" y="310" width="148" height="56" rx="7" fill="url(#das-g)"/>
  <text x="129" y="328" text-anchor="middle" font-size="8.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700">DAS</text>
  <text x="129" y="343" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="white">Portes coupe-feu</text>
  <text x="129" y="357" text-anchor="middle" font-size="8.5" font-family="Arial,sans-serif" fill="#ffccb0">Fermeture automatique</text>

  <!-- DAS 2: Désenfumage -->
  <rect x="215" y="310" width="148" height="56" rx="7" fill="url(#das-g)"/>
  <text x="289" y="328" text-anchor="middle" font-size="8.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700">DAS</text>
  <text x="289" y="343" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="white">Désenfumage</text>
  <text x="289" y="357" text-anchor="middle" font-size="8.5" font-family="Arial,sans-serif" fill="#ffccb0">Ouvrants · Extracteurs</text>

  <!-- DAS 3: Issues de secours -->
  <rect x="375" y="310" width="148" height="56" rx="7" fill="url(#das-g)"/>
  <text x="449" y="328" text-anchor="middle" font-size="8.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700">DAS</text>
  <text x="449" y="343" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="white">Issues de secours</text>
  <text x="449" y="357" text-anchor="middle" font-size="8.5" font-family="Arial,sans-serif" fill="#ffccb0">Déverrouillage automatique</text>

  <!-- ECS/Alarme -->
  <rect x="535" y="310" width="90" height="56" rx="7" fill="#2a5a2a"/>
  <text x="580" y="328" text-anchor="middle" font-size="8.5" font-weight="bold" font-family="Arial,sans-serif" fill="#ffd700">ECS</text>
  <text x="580" y="343" text-anchor="middle" font-size="10" font-weight="bold" font-family="Arial,sans-serif" fill="white">Alarme</text>
  <text x="580" y="357" text-anchor="middle" font-size="8.5" font-family="Arial,sans-serif" fill="#b0f0b0">Sonore + Lumineux</text>

  <!-- ══ Alarm chain at bottom ══ -->
  <rect x="100" y="378" width="440" height="34" rx="8" fill="#1a2040" stroke="#4060a0" stroke-width="1"/>
  <text x="230" y="399" text-anchor="middle" font-size="9.5" font-family="Arial,sans-serif" fill="#b8d0ff">Alarme <tspan font-weight="bold" fill="white">restreinte</tspan> → PC sécurité (levée de doute)</text>
  <text x="355" y="399" font-size="9.5" font-family="Arial,sans-serif" fill="#8090b8"> → </text>
  <text x="400" y="399" text-anchor="middle" font-size="9.5" font-family="Arial,sans-serif" fill="#b8d0ff">Alarme <tspan font-weight="bold" fill="#ff8866">générale</tspan> → Évacuation</text>
</svg>
