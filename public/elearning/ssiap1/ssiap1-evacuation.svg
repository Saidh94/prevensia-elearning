<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="#1a1a1a">PROCÉDURE D'ÉVACUATION INCENDIE</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#666">Rôles et étapes — à appliquer dès le déclenchement de l'alarme</text>

  <!-- ══ Colonne DÉCLENCHEMENT ══ -->
  <rect x="10" y="56" width="182" height="302" rx="10" fill="#fff3cd" stroke="#e67e00" stroke-width="2"/>
  <rect x="10" y="56" width="182" height="40" rx="10" fill="#e67e00"/>
  <rect x="10" y="76" width="182" height="20" fill="#e67e00"/>
  <text x="101" y="75" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">1. DÉCOUVERTE / ALARME</text>
  <text x="101" y="89" text-anchor="middle" font-size="10" fill="#ffe4b0">Signal · Détecteur · Déclencheur manuel</text>

  <!-- Steps -->
  <circle cx="28" cy="120" r="10" fill="#e67e00"/>
  <text x="28" y="124" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">1</text>
  <text x="46" y="116" font-size="10" font-weight="700" fill="#8b5e00">Découvrir le début d'incendie</text>
  <text x="46" y="130" font-size="10" fill="#555">Ou entendre l'alarme</text>

  <circle cx="28" cy="156" r="10" fill="#e67e00"/>
  <text x="28" y="160" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">2</text>
  <text x="46" y="152" font-size="10" font-weight="700" fill="#8b5e00">Déclencher l'alarme</text>
  <text x="46" y="166" font-size="10" fill="#555">Briser glace · Bris de glace (DM)</text>

  <circle cx="28" cy="192" r="10" fill="#e67e00"/>
  <text x="28" y="196" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">3</text>
  <text x="46" y="188" font-size="10" font-weight="700" fill="#8b5e00">Alerter les secours</text>
  <text x="46" y="202" font-size="10" fill="#555">18 (pompiers) / 112</text>

  <circle cx="28" cy="228" r="10" fill="#e67e00"/>
  <text x="28" y="232" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">4</text>
  <text x="46" y="224" font-size="10" font-weight="700" fill="#8b5e00">Attaquer si possible</text>
  <text x="46" y="238" font-size="10" fill="#555">Si début de feu · Voie de retraite</text>

  <circle cx="28" cy="264" r="10" fill="#cc2200"/>
  <text x="28" y="268" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">!</text>
  <text x="46" y="260" font-size="10" font-weight="700" fill="#cc2200">NE JAMAIS tenter d'éteindre</text>
  <text x="46" y="274" font-size="10" fill="#cc2200">si feu trop important</text>
  <text x="46" y="288" font-size="10" fill="#cc2200">ou voie de retraite bloquée</text>

  <!-- ══ Colonne ÉVACUATION ══ -->
  <rect x="206" y="56" width="224" height="302" rx="10" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="2"/>
  <rect x="206" y="56" width="224" height="40" rx="10" fill="#1a4e8c"/>
  <rect x="206" y="76" width="224" height="20" fill="#1a4e8c"/>
  <text x="318" y="75" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">2. ÉVACUATION</text>
  <text x="318" y="89" text-anchor="middle" font-size="10" fill="#9ec8ff">Ordonné · Calme · Dirigé</text>

  <!-- Guide-file -->
  <rect x="214" y="106" width="208" height="56" rx="6" fill="#dbeafe" stroke="#1a4e8c" stroke-width="1"/>
  <text x="318" y="122" text-anchor="middle" font-size="11" font-weight="800" fill="#1a2e6e">GUIDE-FILE (en tête)</text>
  <text x="318" y="138" text-anchor="middle" font-size="10" fill="#333">Guide le groupe vers la sortie</text>
  <text x="318" y="152" text-anchor="middle" font-size="10" fill="#333">Ouvre les portes coupe-feu</text>

  <!-- Serre-file -->
  <rect x="214" y="170" width="208" height="56" rx="6" fill="#dbeafe" stroke="#1a4e8c" stroke-width="1"/>
  <text x="318" y="186" text-anchor="middle" font-size="11" font-weight="800" fill="#1a2e6e">SERRE-FILE (en queue)</text>
  <text x="318" y="202" text-anchor="middle" font-size="10" fill="#333">Ferme les portes derrière lui</text>
  <text x="318" y="216" text-anchor="middle" font-size="10" fill="#333">S'assure que personne ne reste</text>

  <!-- Consignes évacuation -->
  <text x="318" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#1a4e8c">Consignes obligatoires :</text>
  <text x="222" y="260" font-size="10" fill="#333">• Ne pas utiliser l'ascenseur</text>
  <text x="222" y="276" font-size="10" fill="#333">• Ne pas courir · Rester calme</text>
  <text x="222" y="292" font-size="10" fill="#333">• Se diriger vers sortie la plus proche</text>
  <text x="222" y="308" font-size="10" fill="#333">• Se munir de ses affaires si proche</text>
  <text x="222" y="324" font-size="10" fill="#333">• Fermer les portes derrière soi</text>
  <text x="222" y="340" font-size="10" fill="#cc2200" font-weight="700">• Ne jamais retourner en arrière</text>

  <!-- ══ Colonne RASSEMBLEMENT ══ -->
  <rect x="444" y="56" width="186" height="302" rx="10" fill="#f0fff4" stroke="#1a5c1a" stroke-width="2"/>
  <rect x="444" y="56" width="186" height="40" rx="10" fill="#1a5c1a"/>
  <rect x="444" y="76" width="186" height="20" fill="#1a5c1a"/>
  <text x="537" y="75" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">3. RASSEMBLEMENT</text>
  <text x="537" y="89" text-anchor="middle" font-size="10" fill="#9effc0">Comptage · Attente secours</text>

  <rect x="452" y="106" width="170" height="44" rx="6" fill="#d1fae5" stroke="#1a5c1a" stroke-width="1"/>
  <text x="537" y="122" text-anchor="middle" font-size="11" font-weight="800" fill="#1a5c1a">Point de rassemblement</text>
  <text x="537" y="138" text-anchor="middle" font-size="10" fill="#333">Lieu prédéfini et signalisé</text>

  <text x="452" y="170" font-size="10" font-weight="700" fill="#1a5c1a">Au point de rassemblement :</text>
  <text x="452" y="188" font-size="10" fill="#333">• Appel nominal obligatoire</text>
  <text x="452" y="204" font-size="10" fill="#333">• Signaler toute personne</text>
  <text x="452" y="218" font-size="10" fill="#333">  manquante aux secours</text>
  <text x="452" y="234" font-size="10" fill="#333">• Rester groupés</text>
  <text x="452" y="250" font-size="10" fill="#333">• Accueillir les pompiers</text>
  <text x="452" y="266" font-size="10" fill="#333">• Indiquer l'origine du feu</text>

  <rect x="452" y="282" width="170" height="36" rx="6" fill="#fff3cd" stroke="#e67e00" stroke-width="1.5"/>
  <text x="537" y="297" text-anchor="middle" font-size="10" font-weight="700" fill="#8b5e00">Exercice obligatoire :</text>
  <text x="537" y="311" text-anchor="middle" font-size="10" fill="#8b5e00">Au moins 1 fois par an</text>

  <!-- Flèches entre colonnes -->
  <polygon points="198,168 188,162 188,174" fill="#cc2200"/>
  <line x1="188" y1="168" x2="204" y2="168" stroke="#cc2200" stroke-width="3"/>

  <polygon points="438,168 428,162 428,174" fill="#cc2200"/>
  <line x1="428" y1="168" x2="442" y2="168" stroke="#cc2200" stroke-width="3"/>

  <!-- Note bas -->
  <rect x="10" y="368" width="620" height="10" rx="4" fill="#1a2e6e" opacity="0.15"/>
  <text x="320" y="378" text-anchor="middle" font-size="10" fill="#666" font-style="italic">La signalisation de sécurité (flèches vertes) doit guider en permanence vers les sorties de secours</text>

</svg>
