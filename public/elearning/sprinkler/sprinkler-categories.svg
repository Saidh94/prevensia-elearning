<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F0FDF4"/>
  <rect x="52" y="52" width="1096" height="596" rx="28" fill="white" stroke="#BBF7D0" stroke-width="2"/>
  <text x="92" y="118" fill="#14532D" font-family="Arial, sans-serif" font-size="36" font-weight="700">Categories de marchandises NF EN 12845</text>
  <text x="92" y="156" fill="#166534" font-family="Arial, sans-serif" font-size="20">Plus la categorie est elevee, plus les contraintes de hauteur et de protection sont fortes.</text>

  <rect x="92" y="186" width="232" height="340" rx="20" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="208" y="226" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="28" font-weight="700">CAT. I</text>
  <text x="208" y="260" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="14">Peu combustibles</text>
  <text x="112" y="300" fill="#14532D" font-family="Arial, sans-serif" font-size="14">Metaux, verre</text>
  <text x="112" y="324" fill="#14532D" font-family="Arial, sans-serif" font-size="14">Ceramiques</text>
  <text x="112" y="348" fill="#14532D" font-family="Arial, sans-serif" font-size="14">Materiaux mineraux</text>
  <text x="112" y="394" fill="#14532D" font-family="Arial, sans-serif" font-size="16" font-weight="700">Hauteur max</text>
  <text x="112" y="420" fill="#14532D" font-family="Arial, sans-serif" font-size="28" font-weight="700">4,0 m</text>
  <text x="112" y="448" fill="#166534" font-family="Arial, sans-serif" font-size="13">en empilage OH3</text>

  <rect x="344" y="186" width="232" height="340" rx="20" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
  <text x="460" y="226" text-anchor="middle" fill="#713F12" font-family="Arial, sans-serif" font-size="28" font-weight="700">CAT. II</text>
  <text x="460" y="260" text-anchor="middle" fill="#854D0E" font-family="Arial, sans-serif" font-size="14">Combustibles moyens</text>
  <text x="364" y="300" fill="#78350F" font-family="Arial, sans-serif" font-size="14">Papier, carton</text>
  <text x="364" y="324" fill="#78350F" font-family="Arial, sans-serif" font-size="14">Fibres naturelles</text>
  <text x="364" y="348" fill="#78350F" font-family="Arial, sans-serif" font-size="14">Bois non traite</text>
  <text x="364" y="394" fill="#713F12" font-family="Arial, sans-serif" font-size="16" font-weight="700">Hauteur max</text>
  <text x="364" y="420" fill="#713F12" font-family="Arial, sans-serif" font-size="28" font-weight="700">3,0 m</text>
  <text x="364" y="448" fill="#854D0E" font-family="Arial, sans-serif" font-size="13">en empilage OH3</text>

  <rect x="596" y="186" width="232" height="340" rx="20" fill="#FFEDD5" stroke="#F97316" stroke-width="2"/>
  <text x="712" y="226" text-anchor="middle" fill="#9A3412" font-family="Arial, sans-serif" font-size="28" font-weight="700">CAT. III</text>
  <text x="712" y="260" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="14">Combustibles eleves</text>
  <text x="616" y="300" fill="#9A3412" font-family="Arial, sans-serif" font-size="14">Textiles, cuir</text>
  <text x="616" y="324" fill="#9A3412" font-family="Arial, sans-serif" font-size="14">Certains plastiques</text>
  <text x="616" y="348" fill="#9A3412" font-family="Arial, sans-serif" font-size="14">Caoutchouc</text>
  <text x="616" y="394" fill="#9A3412" font-family="Arial, sans-serif" font-size="16" font-weight="700">Hauteur max</text>
  <text x="616" y="420" fill="#9A3412" font-family="Arial, sans-serif" font-size="28" font-weight="700">2,1 m</text>
  <text x="616" y="448" fill="#C2410C" font-family="Arial, sans-serif" font-size="13">en empilage OH3</text>

  <rect x="848" y="186" width="300" height="340" rx="20" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="998" y="226" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="28" font-weight="700">CAT. IV</text>
  <text x="998" y="260" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="14">Tres combustibles</text>
  <text x="868" y="300" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="14">Plastiques synthetiques</text>
  <text x="868" y="324" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="14">Mousses polyurethane</text>
  <text x="868" y="348" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="14">Materiaux expanses</text>
  <text x="868" y="394" fill="#991B1B" font-family="Arial, sans-serif" font-size="16" font-weight="700">Hauteur max</text>
  <text x="868" y="420" fill="#991B1B" font-family="Arial, sans-serif" font-size="28" font-weight="700">1,2 m</text>
  <text x="868" y="448" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="13">en empilage OH3</text>
  <text x="868" y="476" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="13">Au-dela → classe HHS</text>

  <rect x="92" y="548" width="1056" height="80" rx="16" fill="#14532D"/>
  <text x="120" y="580" fill="#DCFCE7" font-family="Arial, sans-serif" font-size="17">Depasser la hauteur limite de sa categorie = reclassification automatique en HH ou HHS.</text>
  <text x="120" y="610" fill="#DCFCE7" font-family="Arial, sans-serif" font-size="17">Tout changement de marchandise ou de mode de stockage doit etre evalue avant d'etre mis en oeuvre.</text>
</svg>
