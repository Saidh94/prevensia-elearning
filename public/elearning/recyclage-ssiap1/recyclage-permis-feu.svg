<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#1a1a1a">GESTION DES TRAVAUX EN ERP/IGH — PERMIS DE FEU</text>
  <text x="340" y="44" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Travaux par points chauds : processus, inhibition SSI et ronde post-travaux</text>

  <!-- ── ÉTAPE 1 : Avant travaux ── -->
  <rect x="10" y="58" width="195" height="140" rx="10" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="2"/>
  <rect x="10" y="58" width="195" height="28" rx="10" fill="#1a4e8c"/>
  <rect x="10" y="76" width="195" height="10" fill="#1a4e8c"/>
  <text x="107" y="77" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">① AVANT LES TRAVAUX</text>
  <text x="25" y="101" font-size="8.5" fill="#1a4e8c" font-weight="700">Permis de feu :</text>
  <text x="25" y="114" font-size="8" fill="#333">• Zone et nature des travaux</text>
  <text x="25" y="126" font-size="8" fill="#333">• Durée prévue</text>
  <text x="25" y="138" font-size="8" fill="#333">• Risques + mesures protection</text>
  <text x="25" y="150" font-size="8" fill="#333">• Moyen d'extinction à portée</text>
  <text x="25" y="162" font-size="8" fill="#cc2200" font-weight="700">• Signatures exploitant + responsable</text>
  <text x="25" y="174" font-size="8" fill="#333">• Archivage après clôture</text>
  <text x="25" y="186" font-size="8" fill="#1a5c1a" font-weight="700">→ Consignation sur main courante</text>

  <!-- Flèche 1 → 2 -->
  <line x1="205" y1="128" x2="230" y2="128" stroke="#1a4e8c" stroke-width="2"/>
  <polygon points="232,128 226,123 226,133" fill="#1a4e8c"/>

  <!-- ── ÉTAPE 2 : Inhibition SSI ── -->
  <rect x="232" y="58" width="195" height="140" rx="10" fill="#fff8e1" stroke="#e67e00" stroke-width="2"/>
  <rect x="232" y="58" width="195" height="28" rx="10" fill="#e67e00"/>
  <rect x="232" y="76" width="195" height="10" fill="#e67e00"/>
  <text x="329" y="77" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">② INHIBITION SSI</text>
  <text x="247" y="101" font-size="8.5" fill="#8b5e00" font-weight="700">Mise hors service temporaire :</text>
  <text x="247" y="114" font-size="8" fill="#333">• Date et heure de mise hors service</text>
  <text x="247" y="126" font-size="8" fill="#333">• Zone concernée (numéro + localisation)</text>
  <text x="247" y="138" font-size="8" fill="#333">• Motif (travaux / type intervention)</text>
  <text x="247" y="150" font-size="8" fill="#333">• Durée prévue</text>
  <text x="247" y="162" font-size="8" fill="#333">• Personne ayant effectué l'inhibition</text>
  <text x="247" y="174" font-size="8" fill="#cc2200" font-weight="700">⚠ Surveillance humaine renforcée</text>
  <text x="247" y="186" font-size="8" fill="#cc2200" font-weight="700">   pendant toute la durée</text>

  <!-- Flèche 2 → 3 -->
  <line x1="427" y1="128" x2="452" y2="128" stroke="#e67e00" stroke-width="2"/>
  <polygon points="454,128 448,123 448,133" fill="#e67e00"/>

  <!-- ── ÉTAPE 3 : Travaux ── -->
  <rect x="454" y="58" width="215" height="140" rx="10" fill="#ffefdf" stroke="#cc4400" stroke-width="2"/>
  <rect x="454" y="58" width="215" height="28" rx="10" fill="#cc4400"/>
  <rect x="454" y="76" width="215" height="10" fill="#cc4400"/>
  <text x="561" y="77" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">③ TRAVAUX EN COURS</text>
  <text x="469" y="101" font-size="8.5" fill="#cc4400" font-weight="700">Points chauds :</text>
  <text x="469" y="114" font-size="8" fill="#333">• Soudage, meulage, oxycoupage</text>
  <text x="469" y="126" font-size="8" fill="#333">• Découpe thermique, chalumeau</text>
  <text x="469" y="138" font-size="8.5" fill="#cc4400" font-weight="700">Projections jusqu'à 10 m !</text>
  <text x="469" y="152" font-size="8" fill="#333">• Zone dégagée de matières combus.</text>
  <text x="469" y="164" font-size="8" fill="#333">• Extincteur portatif à portée</text>
  <text x="469" y="176" font-size="8" fill="#1a5c1a" font-weight="700">• Binôme ou vigile présent</text>
  <text x="469" y="188" font-size="8" fill="#1a5c1a" font-weight="700">• Agent SSIAP1 informé</text>

  <!-- ── Séparation haut / bas ── -->
  <line x1="10" y1="208" x2="669" y2="208" stroke="#dee2e6" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ── ÉTAPE 4 : Ronde post-travaux ── -->
  <rect x="10" y="220" width="300" height="130" rx="10" fill="#f0fff4" stroke="#1a5c1a" stroke-width="2"/>
  <rect x="10" y="220" width="300" height="28" rx="10" fill="#1a5c1a"/>
  <rect x="10" y="238" width="300" height="10" fill="#1a5c1a"/>
  <text x="160" y="239" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">④ RONDE POST-TRAVAUX — 2 HEURES MINIMUM</text>
  <text x="25" y="261" font-size="8.5" fill="#1a5c1a" font-weight="700">Risque de feu couvant dans les 2h suivant les travaux !</text>
  <text x="25" y="277" font-size="8" fill="#333">✓ Absence de fumée ou odeur de brûlé</text>
  <text x="25" y="291" font-size="8" fill="#333">✓ Température des surfaces (main sur cloisons)</text>
  <text x="25" y="305" font-size="8" fill="#333">✓ État des matériaux combustibles proches</text>
  <text x="25" y="319" font-size="8" fill="#333">✓ Vérification des espaces inaccessibles</text>
  <text x="25" y="334" font-size="8" fill="#cc2200" font-weight="700">→ Consigner la ronde sur la main courante</text>
  <text x="25" y="346" font-size="8" fill="#cc2200" font-weight="700">→ Réarmer la zone SSI après ronde satisfaisante</text>

  <!-- ── Mesures compensatoires ── -->
  <rect x="322" y="220" width="347" height="130" rx="10" fill="#fdf2ff" stroke="#7b2d8b" stroke-width="1.5"/>
  <rect x="322" y="220" width="347" height="28" rx="10" fill="#7b2d8b"/>
  <rect x="322" y="238" width="347" height="10" fill="#7b2d8b"/>
  <text x="495" y="239" text-anchor="middle" font-size="10" font-weight="900" fill="#fff">MESURES COMPENSATOIRES (SSI hors service)</text>
  <text x="337" y="261" font-size="8.5" fill="#7b2d8b" font-weight="700">Lors de toute indisponibilité d'un équipement sécurité :</text>
  <text x="337" y="277" font-size="8" fill="#333">• Augmenter la fréquence des rondes dans la zone</text>
  <text x="337" y="291" font-size="8" fill="#333">• Positionner un agent de surveillance physique</text>
  <text x="337" y="305" font-size="8" fill="#333">• Réduire l'effectif accueilli si risque élevé</text>
  <text x="337" y="319" font-size="8" fill="#333">• Informer l'ensemble du personnel de la zone</text>
  <text x="337" y="333" font-size="8" fill="#7b2d8b" font-weight="700">• Signaler à la direction + inscrire au registre sécurité</text>
  <text x="337" y="347" font-size="8" fill="#1a5c1a" font-weight="700">→ Cesser dès remise en service et vérification</text>

  <!-- ── Références légales ── -->
  <rect x="10" y="358" width="659" height="28" rx="6" fill="#1a2e6e"/>
  <text x="340" y="368" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">RÉGLEMENTATION :</text>
  <text x="340" y="380" text-anchor="middle" font-size="8" fill="#aac4ff">Code du travail Art. R.4512-6 (Plan de prévention) · Règlement ERP (travaux en exploitation) · NF S 61-940 (Maintenance SSI)</text>

</svg>
