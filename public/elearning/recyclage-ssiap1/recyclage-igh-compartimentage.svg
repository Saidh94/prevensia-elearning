<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="900" fill="#1a1a1a">SPÉCIFICITÉS IGH — COMPARTIMENTAGE ET ÉVACUATION</text>
  <text x="340" y="44" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Immeuble de Grande Hauteur : stratégie d'évacuation différée par compartiment</text>

  <!-- ── Silhouette immeuble IGH ── -->
  <!-- Corps immeuble -->
  <rect x="260" y="55" width="160" height="290" rx="4" fill="#e8f0fb" stroke="#1a4e8c" stroke-width="2"/>

  <!-- Niveaux et compartiments (du haut vers le bas) -->
  <!-- Niveau 6 -->
  <rect x="260" y="55" width="160" height="42" rx="0" fill="#dce8f8" stroke="#1a4e8c" stroke-width="0.8"/>
  <text x="340" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#1a4e8c">Niveau 6</text>
  <text x="340" y="84" text-anchor="middle" font-size="8" fill="#444">Compartiment 6A</text>

  <!-- Niveau 5 — SINISTRE -->
  <rect x="260" y="97" width="160" height="42" rx="0" fill="#ffeaea" stroke="#cc2200" stroke-width="1.5"/>
  <text x="340" y="114" text-anchor="middle" font-size="9" font-weight="700" fill="#cc2200">Niveau 5 🔥 SINISTRE</text>
  <text x="340" y="126" text-anchor="middle" font-size="8" fill="#cc2200">Évacuation immédiate</text>

  <!-- Niveau 4 — Alerte -->
  <rect x="260" y="139" width="160" height="42" rx="0" fill="#fff8e1" stroke="#e67e00" stroke-width="1.2"/>
  <text x="340" y="156" text-anchor="middle" font-size="9" font-weight="700" fill="#e67e00">Niveau 4</text>
  <text x="340" y="168" text-anchor="middle" font-size="8" fill="#e67e00">Alarme restreinte — Alerte</text>

  <!-- Niveau 3 — Alerte -->
  <rect x="260" y="181" width="160" height="42" rx="0" fill="#fff8e1" stroke="#e67e00" stroke-width="1.2"/>
  <text x="340" y="198" text-anchor="middle" font-size="9" font-weight="700" fill="#e67e00">Niveau 3</text>
  <text x="340" y="210" text-anchor="middle" font-size="8" fill="#e67e00">Alarme restreinte — Alerte</text>

  <!-- Niveau 2 -->
  <rect x="260" y="223" width="160" height="42" rx="0" fill="#dce8f8" stroke="#1a4e8c" stroke-width="0.8"/>
  <text x="340" y="240" text-anchor="middle" font-size="9" font-weight="700" fill="#1a4e8c">Niveau 2</text>
  <text x="340" y="252" text-anchor="middle" font-size="8" fill="#444">Normal — En attente</text>

  <!-- Niveau 1 — RDC PCSI -->
  <rect x="260" y="265" width="160" height="42" rx="0" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="0.8"/>
  <text x="340" y="282" text-anchor="middle" font-size="9" font-weight="700" fill="#1a4e8c">Niveau 1 / RDC</text>
  <text x="340" y="294" text-anchor="middle" font-size="8" fill="#1a4e8c">PCSI (≥ 50 m²)</text>

  <!-- Fondations -->
  <rect x="250" y="307" width="180" height="16" rx="3" fill="#1a2e6e"/>
  <text x="340" y="319" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">Accès pompiers — ≤ 3 km du centre SP</text>

  <!-- ── Cage d'escalier surpression ── -->
  <rect x="420" y="55" width="30" height="254" rx="3" fill="#1a5c1a" opacity="0.15" stroke="#1a5c1a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="435" y="140" text-anchor="middle" font-size="8" font-weight="700" fill="#1a5c1a" transform="rotate(-90,435,140)">ESCALIER — SURPRESSION ≥ 20 Pa</text>

  <!-- ── Flèches d'évacuation ── -->
  <!-- Flèche descente depuis niveau sinistré -->
  <line x1="247" y1="118" x2="200" y2="150" stroke="#cc2200" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="185" y="145" text-anchor="end" font-size="9" font-weight="700" fill="#cc2200">Évacuation</text>
  <text x="185" y="157" text-anchor="end" font-size="9" font-weight="700" fill="#cc2200">immédiate</text>

  <!-- Ascenseur pompiers -->
  <rect x="220" y="55" width="22" height="254" rx="3" fill="#8b5e00" opacity="0.12" stroke="#8b5e00" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="231" y="160" text-anchor="middle" font-size="7.5" font-weight="700" fill="#8b5e00" transform="rotate(-90,231,160)">ASCENSEUR POMPIERS (APS)</text>

  <!-- Marqueur flèche rouge -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc2200"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a4e8c"/>
    </marker>
  </defs>

  <!-- ── Légende EAS ── -->
  <circle cx="482" cy="95" r="10" fill="#1a4e8c"/>
  <text x="482" y="99" text-anchor="middle" font-size="8" font-weight="900" fill="#fff">EAS</text>
  <text x="497" y="91" font-size="8.5" fill="#1a4e8c" font-weight="700">Espace d'Attente</text>
  <text x="497" y="103" font-size="8.5" fill="#1a4e8c">Sécurisé (PMR)</text>
  <text x="497" y="115" font-size="8" fill="#555">≤ 40 m de la zone évacuée</text>
  <text x="497" y="127" font-size="8" fill="#555">Communication bidirectionnelle</text>
  <text x="497" y="139" font-size="8" fill="#555">avec le PCSI</text>

  <!-- ── Bloc règles compartiments ── -->
  <rect x="460" y="155" width="205" height="95" rx="8" fill="#f0f4ff" stroke="#1a4e8c" stroke-width="1"/>
  <text x="562" y="172" text-anchor="middle" font-size="9" font-weight="800" fill="#1a4e8c">COMPARTIMENT IGH</text>
  <text x="475" y="190" font-size="8.5" fill="#333">• Longueur max : 75 mètres</text>
  <text x="475" y="204" font-size="8.5" fill="#333">• Surface max : 2 500 m²</text>
  <text x="475" y="218" font-size="8.5" fill="#333">• 1 à 3 niveaux maximum</text>
  <text x="475" y="232" font-size="8.5" fill="#333">• Parois EI/REI 120 (2 heures)</text>
  <text x="475" y="246" font-size="8.5" fill="#cc2200" font-weight="700">• Évacuation différée — pas simultanée</text>

  <!-- ── PCSI bloc ── -->
  <rect x="460" y="260" width="205" height="65" rx="8" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="1"/>
  <text x="562" y="277" text-anchor="middle" font-size="9" font-weight="800" fill="#1a4e8c">PCSI IGH</text>
  <text x="475" y="293" font-size="8.5" fill="#333">• Surface minimale : 50 m²</text>
  <text x="475" y="307" font-size="8.5" fill="#333">• Parois EI/REI 60 — Porte E30</text>
  <text x="475" y="321" font-size="8.5" fill="#333">• Niveau accès services de secours</text>

  <!-- ── Légende couleurs ── -->
  <rect x="10" y="340" width="660" height="52" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <rect x="22" y="354" width="14" height="14" fill="#ffeaea" stroke="#cc2200" stroke-width="1"/>
  <text x="42" y="365" font-size="8.5" fill="#333">Zone sinistrée — évacuation immédiate</text>
  <rect x="180" y="354" width="14" height="14" fill="#fff8e1" stroke="#e67e00" stroke-width="1"/>
  <text x="200" y="365" font-size="8.5" fill="#333">Zones adjacentes — alarme restreinte</text>
  <rect x="370" y="354" width="14" height="14" fill="#1a5c1a" opacity="0.2" stroke="#1a5c1a" stroke-width="1"/>
  <text x="390" y="365" font-size="8.5" fill="#333">Surpression ≥ 20 Pa (cage escalier)</text>
  <rect x="540" y="354" width="14" height="14" fill="#8b5e00" opacity="0.2" stroke="#8b5e00" stroke-width="1"/>
  <text x="560" y="365" font-size="8.5" fill="#333">Ascenseur pompiers (APS)</text>
  <!-- ligne 2 légende -->
  <rect x="22" y="374" width="14" height="10" fill="#dce8f8" stroke="#1a4e8c" stroke-width="1"/>
  <text x="42" y="383" font-size="8.5" fill="#333">Zones normales / en attente</text>

</svg>
