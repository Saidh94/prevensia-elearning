<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="330" y="24" text-anchor="middle" font-size="17" font-weight="900" fill="#1a1a1a">CATÉGORIES D'ÉQUIPEMENTS ATEX / IECEx</text>
  <text x="330" y="42" text-anchor="middle" font-size="11" fill="#666">EPL = Equipment Protection Level (Niveau de protection de l'équipement)</text>

  <!-- En-têtes -->
  <rect x="10" y="52" width="220" height="36" rx="4" fill="#1a2e6e"/>
  <text x="120" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Catégorie d'appareils</text>
  <text x="120" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">et type d'environnement</text>

  <rect x="234" y="52" width="280" height="36" rx="4" fill="#1a2e6e"/>
  <text x="374" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Classification des zones</text>
  <text x="374" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">ATEX / IECEx</text>

  <rect x="518" y="52" width="132" height="36" rx="4" fill="#1a2e6e"/>
  <text x="584" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Niveau de protection</text>
  <text x="584" y="80" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">EPL</text>

  <!-- Séparateur GAZ / DUST -->
  <rect x="10" y="92" width="44" height="108" rx="4" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="1.5"/>
  <text x="32" y="148" text-anchor="middle" font-size="13" font-weight="900" fill="#1a4e8c" transform="rotate(-90,32,148)">GAZ</text>

  <!-- Ligne 1G -->
  <rect x="58" y="92" width="172" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="92" width="36" height="36" fill="#ff4d00"/>
  <text x="76" y="115" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">1G</text>
  <text x="155" y="115" text-anchor="middle" font-size="12" fill="#444">Zone (gaz)</text>
  <!-- Zones couvertes 0, 1, 2 -->
  <rect x="234" y="92" width="280" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <!-- Zone 0 highlight -->
  <rect x="244" y="96" width="52" height="28" rx="4" fill="#ff4d00"/>
  <text x="270" y="115" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">0</text>
  <text x="350" y="115" text-anchor="middle" font-size="13" fill="#888">1</text>
  <text x="460" y="115" text-anchor="middle" font-size="13" fill="#888">2</text>
  <rect x="518" y="92" width="132" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="115" text-anchor="middle" font-size="14" font-weight="800" fill="#ff4d00">Ga</text>

  <!-- Ligne 2G -->
  <rect x="58" y="128" width="172" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="128" width="36" height="36" fill="#e67e00"/>
  <text x="76" y="151" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">2G</text>
  <text x="155" y="151" text-anchor="middle" font-size="12" fill="#444">Zone (gaz)</text>
  <rect x="234" y="128" width="280" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="151" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="304" y="132" width="52" height="28" rx="4" fill="#e67e00"/>
  <text x="330" y="151" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">1</text>
  <text x="460" y="151" text-anchor="middle" font-size="13" fill="#888">2</text>
  <rect x="518" y="128" width="132" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="151" text-anchor="middle" font-size="14" font-weight="800" fill="#e67e00">Gb</text>

  <!-- Ligne 3G -->
  <rect x="58" y="164" width="172" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="164" width="36" height="36" fill="#c9a200"/>
  <text x="76" y="187" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">3G</text>
  <text x="155" y="187" text-anchor="middle" font-size="12" fill="#444">Zone (gaz)</text>
  <rect x="234" y="164" width="280" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="187" text-anchor="middle" font-size="13" fill="#888">0</text>
  <text x="330" y="187" text-anchor="middle" font-size="13" fill="#888">1</text>
  <rect x="414" y="168" width="52" height="28" rx="4" fill="#c9a200"/>
  <text x="440" y="187" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">2</text>
  <rect x="518" y="164" width="132" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="187" text-anchor="middle" font-size="14" font-weight="800" fill="#c9a200">Gc</text>

  <!-- Séparateur DUST -->
  <rect x="10" y="204" width="44" height="108" rx="4" fill="#fff3e0" stroke="#8b5e00" stroke-width="1.5"/>
  <text x="32" y="258" text-anchor="middle" font-size="11" font-weight="900" fill="#8b5e00" transform="rotate(-90,32,258)">DUST (poussières)</text>

  <!-- Ligne 1D -->
  <rect x="58" y="204" width="172" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="204" width="36" height="36" fill="#ff4d00"/>
  <text x="76" y="227" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">1D</text>
  <text x="155" y="227" text-anchor="middle" font-size="12" fill="#444">Zone (poussières)</text>
  <rect x="234" y="204" width="280" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="244" y="208" width="52" height="28" rx="4" fill="#ff4d00"/>
  <text x="270" y="227" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">20</text>
  <text x="380" y="227" text-anchor="middle" font-size="13" fill="#888">21</text>
  <text x="480" y="227" text-anchor="middle" font-size="13" fill="#888">22</text>
  <rect x="518" y="204" width="132" height="36" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="227" text-anchor="middle" font-size="14" font-weight="800" fill="#ff4d00">Da</text>

  <!-- Ligne 2D -->
  <rect x="58" y="240" width="172" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="240" width="36" height="36" fill="#e67e00"/>
  <text x="76" y="263" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">2D</text>
  <text x="155" y="263" text-anchor="middle" font-size="12" fill="#444">Zone (poussières)</text>
  <rect x="234" y="240" width="280" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="263" text-anchor="middle" font-size="13" fill="#888">20</text>
  <rect x="334" y="244" width="52" height="28" rx="4" fill="#e67e00"/>
  <text x="360" y="263" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">21</text>
  <text x="480" y="263" text-anchor="middle" font-size="13" fill="#888">22</text>
  <rect x="518" y="240" width="132" height="36" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="263" text-anchor="middle" font-size="14" font-weight="800" fill="#e67e00">Db</text>

  <!-- Ligne 3D -->
  <rect x="58" y="276" width="172" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <rect x="58" y="276" width="36" height="36" fill="#c9a200"/>
  <text x="76" y="299" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">3D</text>
  <text x="155" y="299" text-anchor="middle" font-size="12" fill="#444">Zone (poussières)</text>
  <rect x="234" y="276" width="280" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <text x="270" y="299" text-anchor="middle" font-size="13" fill="#888">20</text>
  <text x="360" y="299" text-anchor="middle" font-size="13" fill="#888">21</text>
  <rect x="424" y="280" width="52" height="28" rx="4" fill="#c9a200"/>
  <text x="450" y="299" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">22</text>
  <rect x="518" y="276" width="132" height="36" fill="#fffff0" stroke="#ddd" stroke-width="1"/>
  <text x="584" y="299" text-anchor="middle" font-size="14" font-weight="800" fill="#c9a200">Dc</text>

</svg>
