<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="900" fill="#1a1a1a">DOMAINE D'EXPLOSIVITÉ</text>

  <!-- Axe 0% → 100% -->
  <line x1="30" y1="52" x2="650" y2="52" stroke="#1a2e6e" stroke-width="3"/>
  <polygon points="650,52 638,46 638,58" fill="#1a2e6e"/>
  <rect x="20" y="40" width="46" height="24" rx="5" fill="#2d7a2d"/>
  <text x="43" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">0%</text>
  <rect x="614" y="40" width="52" height="24" rx="5" fill="#2d7a2d"/>
  <text x="640" y="57" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">100%</text>

  <!-- Zone gauche — concentrations basses non-explosives -->
  <rect x="30" y="68" width="195" height="180" rx="0" fill="#c8e6c9"/>
  <text x="127" y="100" text-anchor="middle" font-size="12" fill="#1a5c1a">Concentrations basses</text>
  <text x="127" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#1a5c1a" text-decoration="underline">non-explosives</text>
  <text x="127" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5c1a">Atmosphère</text>
  <text x="127" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5c1a">explosible</text>
  <text x="127" y="194" text-anchor="middle" font-size="11" fill="#2d7a2d">Domaine inférieur</text>
  <text x="127" y="210" text-anchor="middle" font-size="11" fill="#2d7a2d">d'explosibilité</text>
  <text x="127" y="234" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Risque de formation</text>
  <text x="127" y="248" text-anchor="middle" font-size="10" fill="#555" font-style="italic">d'ATEX si concentration ↑</text>

  <!-- Zone centrale — ATEX explosif -->
  <rect x="225" y="68" width="230" height="180" rx="0" fill="#ef9a9a"/>
  <text x="340" y="100" text-anchor="middle" font-size="13" font-weight="900" fill="#7f0000">Concentrations</text>
  <text x="340" y="118" text-anchor="middle" font-size="14" font-weight="900" fill="#7f0000" text-decoration="underline">explosives</text>
  <rect x="285" y="130" width="110" height="28" rx="6" fill="#cc2200"/>
  <text x="340" y="150" text-anchor="middle" font-size="16" font-weight="900" fill="#fff">ATEX</text>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#7f0000">Domaine d'explosivité</text>
  <text x="340" y="210" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Contribution au risque</text>
  <text x="340" y="224" text-anchor="middle" font-size="10" fill="#555" font-style="italic">d'explosion</text>

  <!-- Zone droite — concentrations hautes non-explosives -->
  <rect x="455" y="68" width="195" height="180" rx="0" fill="#c8e6c9"/>
  <text x="552" y="100" text-anchor="middle" font-size="12" fill="#1a5c1a">Concentrations hautes</text>
  <text x="552" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#1a5c1a" text-decoration="underline">non-explosives</text>
  <text x="552" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5c1a">Atmosphère</text>
  <text x="552" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1a5c1a">explosible</text>
  <text x="552" y="194" text-anchor="middle" font-size="11" fill="#2d7a2d">Domaine supérieur</text>
  <text x="552" y="210" text-anchor="middle" font-size="11" fill="#2d7a2d">d'explosibilité</text>
  <text x="552" y="234" text-anchor="middle" font-size="10" fill="#555" font-style="italic">Risque de formation</text>
  <text x="552" y="248" text-anchor="middle" font-size="10" fill="#555" font-style="italic">d'ATEX si concentration ↓</text>

  <!-- LIE marker -->
  <line x1="225" y1="60" x2="225" y2="258" stroke="#1a5c1a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <rect x="182" y="256" width="86" height="24" rx="5" fill="#1a5c1a"/>
  <text x="225" y="273" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">LIE</text>

  <!-- LSE marker -->
  <line x1="455" y1="60" x2="455" y2="258" stroke="#1a5c1a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <rect x="412" y="256" width="86" height="24" rx="5" fill="#1a5c1a"/>
  <text x="455" y="273" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">LSE</text>

  <!-- RATEX bas gauche -->
  <line x1="30" y1="305" x2="455" y2="305" stroke="#cc2200" stroke-width="2.5"/>
  <polygon points="455,305 444,300 444,310" fill="#cc2200"/>
  <rect x="20" y="316" width="96" height="22" rx="4" fill="#c8e6c9" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="68" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5c1a">R_ATEX = 0%</text>
  <rect x="370" y="316" width="96" height="22" rx="4" fill="#c8e6c9" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="418" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#cc2200">R_ATEX = 100%</text>

  <!-- RATEX bas droit -->
  <line x1="225" y1="338" x2="650" y2="338" stroke="#1a2e6e" stroke-width="2.5"/>
  <polygon points="225,338 236,333 236,343" fill="#1a2e6e"/>
  <rect x="468" y="316" width="96" height="22" rx="4" fill="#c8e6c9" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="516" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#cc2200">R_ATEX = 100%</text>
  <rect x="574" y="316" width="96" height="22" rx="4" fill="#c8e6c9" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="622" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#1a5c1a">R_ATEX = 0%</text>

</svg>
