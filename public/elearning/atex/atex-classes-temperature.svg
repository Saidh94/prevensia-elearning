<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="#1a1a1a">CLASSES DE TEMPÉRATURE — APPAREILS ATEX</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#666">Température maximale de surface à comparer avec la température d'auto-inflammation du produit</text>

  <!-- En-têtes -->
  <rect x="20" y="56" width="160" height="36" rx="4" fill="#1a2e6e"/>
  <text x="100" y="79" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Classe de temp.</text>

  <rect x="188" y="56" width="352" height="36" rx="4" fill="#1a2e6e"/>
  <text x="364" y="79" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Valeur maximale de surface (°C)</text>

  <!-- T1 -->
  <rect x="20" y="96" width="160" height="32" fill="#fff3cd" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="117" text-anchor="middle" font-size="16" font-weight="900" fill="#7a4800">T1</text>
  <rect x="188" y="96" width="352" height="32" fill="#fff3cd" stroke="#ddd" stroke-width="1"/>
  <rect x="188" y="96" width="352" height="32" fill="none"/>
  <!-- Barre visuelle -->
  <rect x="200" y="104" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="104" width="328" height="16" rx="4" fill="#ff4d00" opacity="0.7"/>
  <text x="364" y="117" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">450 °C</text>

  <!-- T2 -->
  <rect x="20" y="130" width="160" height="32" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="151" text-anchor="middle" font-size="16" font-weight="900" fill="#c05a00">T2</text>
  <rect x="188" y="130" width="352" height="32" fill="#fff8f0" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="138" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="138" width="218" height="16" rx="4" fill="#e67e00" opacity="0.8"/>
  <text x="364" y="151" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">300 °C</text>

  <!-- T3 -->
  <rect x="20" y="164" width="160" height="32" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="185" text-anchor="middle" font-size="16" font-weight="900" fill="#c9a200">T3</text>
  <rect x="188" y="164" width="352" height="32" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="172" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="172" width="145" height="16" rx="4" fill="#c9a200" opacity="0.8"/>
  <text x="364" y="185" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">200 °C</text>

  <!-- T4 -->
  <rect x="20" y="198" width="160" height="32" fill="#f0fff0" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="219" text-anchor="middle" font-size="16" font-weight="900" fill="#2d7a2d">T4</text>
  <rect x="188" y="198" width="352" height="32" fill="#f0fff0" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="206" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="206" width="98" height="16" rx="4" fill="#2d7a2d" opacity="0.7"/>
  <text x="364" y="219" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">135 °C</text>

  <!-- T5 -->
  <rect x="20" y="232" width="160" height="32" fill="#e8f4ff" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="253" text-anchor="middle" font-size="16" font-weight="900" fill="#1a4e8c">T5</text>
  <rect x="188" y="232" width="352" height="32" fill="#e8f4ff" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="240" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="240" width="73" height="16" rx="4" fill="#1a4e8c" opacity="0.7"/>
  <text x="364" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">100 °C</text>

  <!-- T6 -->
  <rect x="20" y="266" width="160" height="32" fill="#f5f0ff" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="287" text-anchor="middle" font-size="16" font-weight="900" fill="#5a1a8c">T6</text>
  <rect x="188" y="266" width="352" height="32" fill="#f5f0ff" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="274" width="328" height="16" rx="4" fill="#e0e0e0"/>
  <rect x="200" y="274" width="62" height="16" rx="4" fill="#5a1a8c" opacity="0.6"/>
  <text x="364" y="287" text-anchor="middle" font-size="14" font-weight="800" fill="#1a1a1a">85 °C</text>

  <!-- Note bas -->
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#666" font-style="italic">La température de surface doit TOUJOURS être inférieure à la température d'auto-inflammation du produit présent</text>

</svg>
