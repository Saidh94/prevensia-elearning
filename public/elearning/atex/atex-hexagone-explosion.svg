<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="280" y="36" text-anchor="middle" font-size="22" font-weight="900" fill="#cc2200" letter-spacing="1">LES 6 CONDITIONS D'UNE EXPLOSION</text>
  <text x="280" y="58" text-anchor="middle" font-size="13" fill="#555">Toutes doivent être réunies simultanément — supprimer l'une suffit à empêcher l'explosion</text>

  <!-- Hexagone central -->
  <g transform="translate(280,290)">
    <!-- Hexagone fond -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#e8e8e8" stroke="#bbb" stroke-width="2"/>
    <!-- Hexagone intérieur orange -->
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="#e67e00" opacity="0.15"/>
    <!-- Icône explosion centrale -->
    <circle cx="0" cy="0" r="52" fill="#fff" stroke="#e67e00" stroke-width="3"/>
    <!-- Flamme / explosion stylisée -->
    <path d="M0,-38 Q12,-22 8,-8 Q18,-18 22,-6 Q28,10 14,28 Q6,38 0,42 Q-6,38 -14,28 Q-28,10 -22,-6 Q-18,-18 -8,-8 Q-12,-22 0,-38Z" fill="#e67e00"/>
    <path d="M0,-28 Q8,-16 5,-5 Q12,-13 15,-3 Q18,10 8,22 Q4,28 0,30 Q-4,28 -8,22 Q-18,10 -15,-3 Q-12,-13 -5,-5 Q-8,-16 0,-28Z" fill="#f5c300"/>
    <text x="0" y="14" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">EXPLOSION</text>

    <!-- Flèches vers le centre (6 directions) -->
    <!-- Haut -->
    <line x1="0" y1="-112" x2="0" y2="-80" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
    <!-- Haut-droite -->
    <line x1="98" y1="-57" x2="70" y2="-40" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
    <!-- Bas-droite -->
    <line x1="98" y1="57" x2="70" y2="40" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
    <!-- Bas -->
    <line x1="0" y1="112" x2="0" y2="80" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
    <!-- Bas-gauche -->
    <line x1="-98" y1="57" x2="-70" y2="40" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
    <!-- Haut-gauche -->
    <line x1="-98" y1="-57" x2="-70" y2="-40" stroke="#cc2200" stroke-width="3.5" marker-end="url(#arrowRed)"/>
  </g>

  <!-- Marqueur flèche -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="#cc2200"/>
    </marker>
  </defs>

  <!-- Labels des 6 conditions autour -->

  <!-- 1. Haut - Combustible -->
  <rect x="210" y="68" width="140" height="50" rx="8" fill="#fff7e6" stroke="#e67e00" stroke-width="2"/>
  <text x="280" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#e67e00">COMBUSTIBLE</text>
  <text x="280" y="107" text-anchor="middle" font-size="11" fill="#555">gaz, vapeur, poussière</text>

  <!-- 2. Haut-droit - Domaine d'explosivité -->
  <rect x="390" y="148" width="158" height="50" rx="8" fill="#fff0f0" stroke="#cc2200" stroke-width="2"/>
  <text x="469" y="169" text-anchor="middle" font-size="13" font-weight="800" fill="#cc2200">DOMAINE</text>
  <text x="469" y="187" text-anchor="middle" font-size="11" fill="#555">entre LIE et LSE</text>

  <!-- 3. Bas-droit - Comburant -->
  <rect x="390" y="342" width="158" height="50" rx="8" fill="#e8f4ff" stroke="#1a4e8c" stroke-width="2"/>
  <text x="469" y="363" text-anchor="middle" font-size="14" font-weight="800" fill="#1a4e8c">COMBURANT</text>
  <text x="469" y="381" text-anchor="middle" font-size="11" fill="#555">oxygène de l'air</text>

  <!-- 4. Bas - Confinement -->
  <rect x="210" y="422" width="140" height="50" rx="8" fill="#f0fff0" stroke="#2d7a2d" stroke-width="2"/>
  <text x="280" y="443" text-anchor="middle" font-size="14" font-weight="800" fill="#2d7a2d">CONFINEMENT</text>
  <text x="280" y="461" text-anchor="middle" font-size="11" fill="#555">espace limité</text>

  <!-- 5. Bas-gauche - Source d'inflammation -->
  <rect x="12" y="342" width="168" height="50" rx="8" fill="#fff0f0" stroke="#cc2200" stroke-width="2"/>
  <text x="96" y="363" text-anchor="middle" font-size="13" font-weight="800" fill="#cc2200">SOURCE</text>
  <text x="96" y="381" text-anchor="middle" font-size="11" fill="#555">d'inflammation</text>

  <!-- 6. Haut-gauche - Combustible en suspension -->
  <rect x="12" y="148" width="168" height="50" rx="8" fill="#fff7e6" stroke="#e67e00" stroke-width="2"/>
  <text x="96" y="164" text-anchor="middle" font-size="12" font-weight="800" fill="#e67e00">COMBUSTIBLE</text>
  <text x="96" y="180" text-anchor="middle" font-size="11" fill="#555">en suspension</text>
  <text x="96" y="194" text-anchor="middle" font-size="10" fill="#777">(gaz, aérosol, poussières)</text>

  <!-- Note bas -->
  <rect x="40" y="486" width="480" height="28" rx="6" fill="#fff3cd" stroke="#e67e00" stroke-width="1.5"/>
  <text x="280" y="505" text-anchor="middle" font-size="12" fill="#7a4800" font-weight="600">⚠ Supprimer UNE seule condition = explosion impossible</text>

</svg>
