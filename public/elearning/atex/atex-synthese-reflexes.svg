<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 538" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="310" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="#1a1a1a">LES 13 RÉFLEXES EN ZONE ATEX</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#666">Mémo à appliquer systématiquement lors de toute intervention</text>

  <!-- ══ GROUPE 1 — AVANT D'ENTRER ══ -->
  <rect x="10" y="54" width="600" height="22" rx="6" fill="#1a4e8c"/>
  <text x="310" y="69" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">AVANT D'ENTRER EN ZONE ATEX</text>

  <rect x="10"  y="80"  width="600" height="28" fill="#e8f4ff" stroke="#c8dff8" stroke-width="1"/>
  <circle cx="30" cy="94"  r="11" fill="#1a4e8c"/>
  <text x="30" y="98" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">1</text>
  <text x="52" y="98" font-size="11" font-weight="700" fill="#1a4e8c">Connaître la classification exacte de la zone</text>
  <text x="370" y="98" font-size="10" fill="#555">Zone 0/1/2 (gaz) ou Zone 20/21/22 (poussières)</text>

  <rect x="10"  y="110" width="600" height="28" fill="#f0f7ff" stroke="#c8dff8" stroke-width="1"/>
  <circle cx="30" cy="124" r="11" fill="#1a4e8c"/>
  <text x="30" y="128" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">2</text>
  <text x="52" y="128" font-size="11" font-weight="700" fill="#1a4e8c">Posséder une autorisation de travail valide</text>
  <text x="392" y="128" font-size="10" fill="#555">Avant toute intervention, sans exception</text>

  <rect x="10"  y="140" width="600" height="28" fill="#e8f4ff" stroke="#c8dff8" stroke-width="1"/>
  <circle cx="30" cy="154" r="11" fill="#1a4e8c"/>
  <text x="30" y="158" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">3</text>
  <text x="52" y="158" font-size="11" font-weight="700" fill="#1a4e8c">Porter tous les EPI prescrits</text>
  <text x="290" y="158" font-size="10" fill="#555">Vêtements EN 1149-5 · Chaussures ESD · Gants · Explosimètre</text>

  <rect x="10"  y="170" width="600" height="28" fill="#f0f7ff" stroke="#c8dff8" stroke-width="1"/>
  <circle cx="30" cy="184" r="11" fill="#1a4e8c"/>
  <text x="30" y="188" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">4</text>
  <text x="52" y="188" font-size="11" font-weight="700" fill="#1a4e8c">N'utiliser que des équipements certifiés Ex adaptés à la zone</text>
  <text x="504" y="188" font-size="10" fill="#555">1G/2G/3G · 1D/2D/3D</text>

  <rect x="10"  y="200" width="600" height="28" fill="#e8f4ff" stroke="#c8dff8" stroke-width="1"/>
  <circle cx="30" cy="214" r="11" fill="#1a4e8c"/>
  <text x="30" y="218" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">5</text>
  <text x="52" y="218" font-size="11" font-weight="700" fill="#1a4e8c">Contrôler l'atmosphère avec l'explosimètre certifié Ex</text>
  <text x="454" y="218" font-size="10" fill="#555">Alarme réglée à 20 % LIE</text>

  <!-- ══ GROUPE 2 — EN ZONE ══ -->
  <rect x="10" y="234" width="600" height="22" rx="6" fill="#e67e00"/>
  <text x="310" y="249" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">EN ZONE — PENDANT L'INTERVENTION</text>

  <rect x="10"  y="260" width="600" height="28" fill="#fff8ed" stroke="#f5ddb0" stroke-width="1"/>
  <circle cx="30" cy="274" r="11" fill="#e67e00"/>
  <text x="30" y="278" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">6</text>
  <text x="52" y="278" font-size="11" font-weight="700" fill="#8b5e00">Interdire tout appareil non certifié ATEX (téléphone, lampe…)</text>
  <text x="514" y="278" font-size="10" fill="#555">Source d'inflammation</text>

  <rect x="10"  y="290" width="600" height="28" fill="#fffaf0" stroke="#f5ddb0" stroke-width="1"/>
  <circle cx="30" cy="304" r="11" fill="#e67e00"/>
  <text x="30" y="308" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">7</text>
  <text x="52" y="308" font-size="11" font-weight="700" fill="#8b5e00">Interdire absolument fumer et toute flamme nue</text>
  <text x="432" y="308" font-size="10" fill="#555">Zéro tolérance — Sanctions immédiates</text>

  <rect x="10"  y="320" width="600" height="28" fill="#fff8ed" stroke="#f5ddb0" stroke-width="1"/>
  <circle cx="30" cy="334" r="11" fill="#e67e00"/>
  <text x="30" y="338" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">8</text>
  <text x="52" y="338" font-size="11" font-weight="700" fill="#8b5e00">Obtenir un permis de feu avant tout travail par points chauds</text>
  <text x="510" y="338" font-size="10" fill="#555">Soudage · meulage</text>

  <rect x="10"  y="350" width="600" height="28" fill="#fffaf0" stroke="#f5ddb0" stroke-width="1"/>
  <circle cx="30" cy="364" r="11" fill="#e67e00"/>
  <text x="30" y="368" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">9</text>
  <text x="52" y="368" font-size="11" font-weight="700" fill="#8b5e00">Assurer liaison équipotentielle et mise à la terre des équipements</text>
  <text x="536" y="368" font-size="10" fill="#555">Anti-statique</text>

  <rect x="10"  y="380" width="600" height="28" fill="#fff8ed" stroke="#f5ddb0" stroke-width="1"/>
  <circle cx="30" cy="394" r="11" fill="#e67e00"/>
  <text x="30" y="398" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">10</text>
  <text x="52" y="398" font-size="11" font-weight="700" fill="#8b5e00">Signaler immédiatement toute fuite, anomalie ou dégradation</text>
  <text x="512" y="398" font-size="10" fill="#555">Arrêt + alerte responsable</text>

  <!-- ══ GROUPE 3 — URGENCE / VIGILANCE ══ -->
  <rect x="10" y="414" width="600" height="22" rx="6" fill="#cc2200"/>
  <text x="310" y="429" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">URGENCE ET VIGILANCE PERMANENTE</text>

  <rect x="10"  y="440" width="600" height="28" fill="#fff0f0" stroke="#f5b8b8" stroke-width="1"/>
  <circle cx="30" cy="454" r="11" fill="#cc2200"/>
  <text x="30" y="458" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">11</text>
  <text x="52" y="458" font-size="11" font-weight="700" fill="#cc2200">Alarme détecteur → arrêt immédiat + évacuation calme + alerte</text>
  <text x="514" y="458" font-size="10" fill="#555">Réflexe PEAS</text>

  <rect x="10"  y="470" width="600" height="28" fill="#fff8f8" stroke="#f5b8b8" stroke-width="1"/>
  <circle cx="30" cy="484" r="11" fill="#cc2200"/>
  <text x="30" y="488" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">12</text>
  <text x="52" y="488" font-size="11" font-weight="700" fill="#cc2200">Ne jamais sous-estimer le risque poussières</text>
  <text x="388" y="488" font-size="10" fill="#555">Maintenir les locaux propres · éviter les dépôts</text>

  <rect x="10"  y="500" width="600" height="28" fill="#fff0f0" stroke="#f5b8b8" stroke-width="1"/>
  <circle cx="30" cy="514" r="11" fill="#cc2200"/>
  <text x="30" y="518" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">13</text>
  <text x="52" y="518" font-size="11" font-weight="700" fill="#cc2200">Participer aux formations et exercices ATEX organisés par l'employeur</text>

</svg>
