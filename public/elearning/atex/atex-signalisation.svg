<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="Arial, sans-serif">

  <!-- Bandeau jaune ZONE ATEX -->
  <rect x="0" y="0" width="600" height="110" rx="8" fill="#F5C300"/>

  <!-- Triangle Ex gauche -->
  <g transform="translate(40,14)">
    <polygon points="46,0 92,80 0,80" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
    <text x="46" y="56" text-anchor="middle" font-size="22" font-weight="900" fill="#1a1a1a">Ex</text>
  </g>

  <!-- Texte ZONE ATEX -->
  <text x="300" y="72" text-anchor="middle" font-size="58" font-weight="900" fill="#1a1a1a" letter-spacing="2">ZONE ATEX</text>

  <!-- Triangle danger droit -->
  <g transform="translate(468,14)">
    <polygon points="46,0 92,80 0,80" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
    <text x="46" y="60" text-anchor="middle" font-size="40" font-weight="900" fill="#1a1a1a">!</text>
  </g>

  <!-- Sous-titre -->
  <text x="300" y="148" text-anchor="middle" font-size="22" font-weight="700" fill="#1a4e8c">Respectez les consignes de sécurité</text>

  <!-- Picto 1 : Défense de fumer -->
  <g transform="translate(90,175)">
    <circle cx="60" cy="60" r="56" fill="#fff" stroke="#cc2200" stroke-width="6"/>
    <!-- cigarette -->
    <rect x="20" y="52" width="50" height="7" rx="3" fill="#333"/>
    <rect x="65" y="38" width="8" height="22" rx="2" fill="#333" transform="rotate(-15,69,49)"/>
    <!-- fumée -->
    <path d="M52 30 Q55 18 50 10 Q45 2 50 -5" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M60 28 Q63 16 58 8 Q53 0 58 -7" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
    <!-- barre rouge -->
    <line x1="18" y1="18" x2="102" y2="102" stroke="#cc2200" stroke-width="8" stroke-linecap="round"/>
    <text x="60" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Défense de fumer</text>
  </g>

  <!-- Picto 2 : Flamme nue interdite -->
  <g transform="translate(250,175)">
    <circle cx="60" cy="60" r="56" fill="#fff" stroke="#cc2200" stroke-width="6"/>
    <!-- flamme -->
    <path d="M60 80 Q38 65 42 42 Q46 28 55 20 Q50 35 62 38 Q58 25 68 15 Q72 35 80 45 Q88 58 78 75 Z" fill="#e67e00"/>
    <path d="M60 78 Q48 68 51 52 Q54 40 60 34 Q57 45 65 48 Q62 38 68 30 Q72 48 75 55 Q78 65 68 76 Z" fill="#f5c300"/>
    <!-- barre rouge -->
    <line x1="18" y1="18" x2="102" y2="102" stroke="#cc2200" stroke-width="8" stroke-linecap="round"/>
    <text x="60" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Flamme nue interdite</text>
  </g>

  <!-- Picto 3 : Téléphone interdit -->
  <g transform="translate(410,175)">
    <circle cx="60" cy="60" r="56" fill="#fff" stroke="#cc2200" stroke-width="6"/>
    <!-- téléphone portable -->
    <rect x="38" y="28" width="44" height="64" rx="6" fill="#444"/>
    <rect x="42" y="34" width="36" height="42" rx="3" fill="#87ceeb"/>
    <circle cx="60" cy="84" r="4" fill="#888"/>
    <!-- ondes wifi -->
    <path d="M74 26 Q84 16 74 6" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M78 30 Q94 14 78 -2" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <!-- barre rouge -->
    <line x1="18" y1="18" x2="102" y2="102" stroke="#cc2200" stroke-width="8" stroke-linecap="round"/>
    <text x="60" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Tél. non certifié interdit</text>
  </g>

</svg>
