<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Arial, sans-serif">

  <!-- Fond dégradé sombre -->
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a18"/>
      <stop offset="60%"  stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#1a0800"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff8800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond principal -->
  <rect width="800" height="360" fill="url(#heroBg)"/>

  <!-- Grille technique légère -->
  <g opacity="0.07" stroke="#ffaa44" stroke-width="0.5">
    <line x1="0"   y1="60"  x2="800" y2="60"/>
    <line x1="0"   y1="120" x2="800" y2="120"/>
    <line x1="0"   y1="180" x2="800" y2="180"/>
    <line x1="0"   y1="240" x2="800" y2="240"/>
    <line x1="0"   y1="300" x2="800" y2="300"/>
    <line x1="100" y1="0"   x2="100" y2="360"/>
    <line x1="200" y1="0"   x2="200" y2="360"/>
    <line x1="300" y1="0"   x2="300" y2="360"/>
    <line x1="400" y1="0"   x2="400" y2="360"/>
    <line x1="500" y1="0"   x2="500" y2="360"/>
    <line x1="600" y1="0"   x2="600" y2="360"/>
    <line x1="700" y1="0"   x2="700" y2="360"/>
  </g>

  <!-- Halo central explosif animé -->
  <circle cx="600" cy="180" r="130" fill="url(#centerGlow)">
    <animate attributeName="r" values="110;145;110" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneaux explosion (droite) -->
  <circle cx="600" cy="180" r="90" fill="none" stroke="#ff6600" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="70;110;70" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="60" fill="none" stroke="#ffaa00" stroke-width="2" opacity="0.45">
    <animate attributeName="r" values="45;82;45" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.05;0.45" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="38" fill="#e64400" opacity="0.55">
    <animate attributeName="r" values="28;50;28" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0.8;0.55" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="18" fill="#ffcc00" opacity="0.92">
    <animate attributeName="r" values="12;26;12" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="180" r="7" fill="#ffffff" opacity="0.98"/>

  <!-- Losange ATEX (triangle avertissement stylisé) -->
  <polygon points="600,78 688,212 512,212" fill="none" stroke="#ffcc00" stroke-width="3" opacity="0.6"/>
  <polygon points="600,96 672,204 528,204" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>

  <!-- EX text dans le flash -->
  <text x="600" y="188" text-anchor="middle" font-size="22" font-weight="900" fill="#1a0800" opacity="0.9">EX</text>

  <!-- ── Texte gauche ── -->

  <!-- Badge -->
  <rect x="40" y="60" width="240" height="24" rx="12" fill="none" stroke="#ffcc00" stroke-width="1.5"/>
  <text x="160" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#ffcc00" letter-spacing="2">PRÉVENTION DES RISQUES · E-LEARNING</text>

  <!-- Titre principal -->
  <text x="40" y="140" font-size="52" font-weight="900" fill="#ffffff">FORMATION</text>
  <text x="40" y="198" font-size="58" font-weight="900" fill="#ff8c00">ATEX</text>

  <!-- Sous-titre -->
  <text x="40" y="232" font-size="17" fill="#dddddd">Atmosphères Explosives</text>
  <text x="40" y="252" font-size="14" fill="#aaaaaa">Directive 99/92/CE · Zonage · Marquage Ex · EPI</text>

  <!-- Séparateur -->
  <line x1="40" y1="270" x2="460" y2="270" stroke="#ff6600" stroke-width="2" opacity="0.7"/>

  <!-- Badges info -->
  <rect x="40"  y="282" width="80"  height="26" rx="13" fill="#1a4e8c" opacity="0.9"/>
  <text x="80"  y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3 heures</text>

  <rect x="132" y="282" width="92"  height="26" rx="13" fill="#1a5c1a" opacity="0.9"/>
  <text x="178" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">12 modules</text>

  <rect x="236" y="282" width="104" height="26" rx="13" fill="#8b5e00" opacity="0.9"/>
  <text x="288" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Vidéo INRS</text>

  <rect x="352" y="282" width="88"  height="26" rx="13" fill="#cc2200" opacity="0.9"/>
  <text x="396" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">129 € HT</text>

  <!-- Ligne du bas -->
  <rect x="0" y="338" width="800" height="22" fill="#ff6600" opacity="0.12"/>
  <text x="400" y="353" text-anchor="middle" font-size="10" fill="#aaa" letter-spacing="1">PREVENSIA FORMATION · prevensia-formation.fr</text>

</svg>
