<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="900" fill="#1a1a1a">CLASSIFICATION DES ZONES ATEX</text>

  <!-- ═══════════════ COLONNE GAZ ═══════════════ -->
  <rect x="20" y="45" width="295" height="34" rx="6" fill="#1a4e8c"/>
  <text x="167" y="67" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">GAZ · VAPEURS · BROUILLARDS</text>

  <!-- Zone 0 -->
  <rect x="20" y="85" width="295" height="90" rx="6" fill="#ff4d00" opacity="0.12" stroke="#ff4d00" stroke-width="2"/>
  <rect x="20" y="85" width="52" height="90" rx="6" fill="#ff4d00"/>
  <text x="46" y="136" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" transform="rotate(-90,46,136)">ZONE 0</text>
  <text x="88" y="108" font-size="13" font-weight="800" fill="#cc2200">Présence PERMANENTE</text>
  <text x="88" y="126" font-size="12" fill="#444">Longues périodes ou en continu</text>
  <text x="88" y="144" font-size="11" fill="#666">Ex : intérieur d'une cuve, d'un réservoir</text>
  <text x="88" y="162" font-size="11" fill="#666">→ Équipement catégorie 1 obligatoire</text>

  <!-- Zone 1 -->
  <rect x="20" y="183" width="295" height="90" rx="6" fill="#e67e00" opacity="0.12" stroke="#e67e00" stroke-width="2"/>
  <rect x="20" y="183" width="52" height="90" rx="6" fill="#e67e00"/>
  <text x="46" y="234" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" transform="rotate(-90,46,234)">ZONE 1</text>
  <text x="88" y="206" font-size="13" font-weight="800" fill="#c05a00">Présence OCCASIONNELLE</text>
  <text x="88" y="224" font-size="12" fill="#444">En fonctionnement normal</text>
  <text x="88" y="242" font-size="11" fill="#666">Ex : abords d'une bride, d'une vanne</text>
  <text x="88" y="260" font-size="11" fill="#666">→ Équipement catégorie 2 obligatoire</text>

  <!-- Zone 2 -->
  <rect x="20" y="281" width="295" height="90" rx="6" fill="#f5c300" opacity="0.15" stroke="#c9a200" stroke-width="2"/>
  <rect x="20" y="281" width="52" height="90" rx="6" fill="#c9a200"/>
  <text x="46" y="332" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" transform="rotate(-90,46,332)">ZONE 2</text>
  <text x="88" y="304" font-size="13" font-weight="800" fill="#7a6000">Présence RARE / COURTE DURÉE</text>
  <text x="88" y="322" font-size="12" fill="#444">Fonctionnement anormal uniquement</text>
  <text x="88" y="340" font-size="11" fill="#666">Ex : zone périphérique autour zone 1</text>
  <text x="88" y="358" font-size="11" fill="#666">→ Équipement catégorie 3 obligatoire</text>

  <!-- ═══════════════ COLONNE POUSSIÈRES ═══════════════ -->
  <rect x="345" y="45" width="295" height="34" rx="6" fill="#5a3200"/>
  <text x="492" y="67" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">POUSSIÈRES COMBUSTIBLES</text>

  <!-- Zone 20 -->
  <rect x="345" y="85" width="295" height="90" rx="6" fill="#ff4d00" opacity="0.12" stroke="#ff4d00" stroke-width="2"/>
  <rect x="345" y="85" width="56" height="90" rx="6" fill="#ff4d00"/>
  <text x="373" y="136" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" transform="rotate(-90,373,136)">ZONE 20</text>
  <text x="414" y="108" font-size="13" font-weight="800" fill="#cc2200">Présence PERMANENTE</text>
  <text x="414" y="126" font-size="12" fill="#444">Nuage de poussières en continu</text>
  <text x="414" y="144" font-size="11" fill="#666">Ex : intérieur d'un silo, d'un broyeur</text>
  <text x="414" y="162" font-size="11" fill="#666">→ Équipement catégorie 1 obligatoire</text>

  <!-- Zone 21 -->
  <rect x="345" y="183" width="295" height="90" rx="6" fill="#e67e00" opacity="0.12" stroke="#e67e00" stroke-width="2"/>
  <rect x="345" y="183" width="56" height="90" rx="6" fill="#e67e00"/>
  <text x="373" y="234" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" transform="rotate(-90,373,234)">ZONE 21</text>
  <text x="414" y="206" font-size="13" font-weight="800" fill="#c05a00">Présence OCCASIONNELLE</text>
  <text x="414" y="224" font-size="12" fill="#444">En fonctionnement normal</text>
  <text x="414" y="242" font-size="11" fill="#666">Ex : trappe de remplissage d'un silo</text>
  <text x="414" y="260" font-size="11" fill="#666">→ Équipement catégorie 2 obligatoire</text>

  <!-- Zone 22 -->
  <rect x="345" y="281" width="295" height="90" rx="6" fill="#f5c300" opacity="0.15" stroke="#c9a200" stroke-width="2"/>
  <rect x="345" y="281" width="56" height="90" rx="6" fill="#c9a200"/>
  <text x="373" y="332" text-anchor="middle" font-size="20" font-weight="900" fill="#fff" transform="rotate(-90,373,332)">ZONE 22</text>
  <text x="414" y="304" font-size="13" font-weight="800" fill="#7a6000">Présence RARE / COURTE DURÉE</text>
  <text x="414" y="322" font-size="12" fill="#444">Fonctionnement anormal uniquement</text>
  <text x="414" y="340" font-size="11" fill="#666">Ex : zone périphérique autour zone 21</text>
  <text x="414" y="358" font-size="11" fill="#666">→ Équipement catégorie 3 obligatoire</text>

  <!-- Légende bas -->
  <rect x="20" y="382" width="620" height="30" rx="6" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <circle cx="42" cy="397" r="7" fill="#ff4d00"/>
  <text x="56" y="401" font-size="11" fill="#333">Zone 0/20 = risque max</text>
  <circle cx="180" cy="397" r="7" fill="#e67e00"/>
  <text x="194" y="401" font-size="11" fill="#333">Zone 1/21 = risque moyen</text>
  <circle cx="330" cy="397" r="7" fill="#c9a200"/>
  <text x="344" y="401" font-size="11" fill="#333">Zone 2/22 = risque faible</text>
  <text x="490" y="401" font-size="11" fill="#666" font-style="italic">Directive 99/92/CE</text>

</svg>
