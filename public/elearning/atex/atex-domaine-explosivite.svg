<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="Arial, sans-serif">

  <!-- Titre -->
  <text x="310" y="32" text-anchor="middle" font-size="20" font-weight="900" fill="#1a1a1a">DOMAINE D'EXPLOSIVITÉ</text>
  <text x="310" y="52" text-anchor="middle" font-size="13" fill="#555">Concentration du combustible dans l'air</text>

  <!-- Axe principal -->
  <line x1="40" y1="140" x2="580" y2="140" stroke="#bbb" stroke-width="2"/>

  <!-- Zone : Trop pauvre (vert clair) -->
  <rect x="40" y="100" width="180" height="80" rx="0" fill="#d4edda" opacity="0.9"/>
  <text x="130" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#2d7a2d">Trop pauvre</text>
  <text x="130" y="150" text-anchor="middle" font-size="11" fill="#2d7a2d">en combustible</text>
  <text x="130" y="168" text-anchor="middle" font-size="11" fill="#2d7a2d">Pas d'explosion</text>

  <!-- Zone explosive (orange/rouge) -->
  <rect x="220" y="85" width="180" height="110" rx="0" fill="#e67e00" opacity="0.85"/>
  <!-- Flammes stylisées dans la zone explosive -->
  <path d="M290,155 Q295,135 288,122 Q300,132 298,115 Q308,128 312,120 Q316,132 322,125 Q318,140 310,155Z" fill="#fff" opacity="0.25"/>
  <text x="310" y="115" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">DOMAINE</text>
  <text x="310" y="133" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">D'EXPLOSIVITÉ</text>
  <text x="310" y="154" text-anchor="middle" font-size="11" fill="#fff">⚡ EXPLOSION POSSIBLE</text>
  <text x="310" y="172" text-anchor="middle" font-size="10" fill="#ffe0b2">entre LIE et LSE</text>

  <!-- Zone : Trop riche (bleu clair) -->
  <rect x="400" y="100" width="180" height="80" rx="0" fill="#d0e8ff" opacity="0.9"/>
  <text x="490" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#1a4e8c">Trop riche</text>
  <text x="490" y="150" text-anchor="middle" font-size="11" fill="#1a4e8c">en combustible</text>
  <text x="490" y="168" text-anchor="middle" font-size="11" fill="#1a4e8c">Pas d'explosion</text>

  <!-- Marqueur LIE -->
  <line x1="220" y1="80" x2="220" y2="205" stroke="#2d7a2d" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="220,78 214,68 226,68" fill="#2d7a2d"/>
  <rect x="180" y="205" width="80" height="32" rx="6" fill="#2d7a2d"/>
  <text x="220" y="218" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">LIE</text>
  <text x="220" y="231" text-anchor="middle" font-size="10" fill="#c8f7c5">Limite Inférieure</text>

  <!-- Marqueur LSE -->
  <line x1="400" y1="80" x2="400" y2="205" stroke="#1a4e8c" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="400,78 394,68 406,68" fill="#1a4e8c"/>
  <rect x="360" y="205" width="80" height="32" rx="6" fill="#1a4e8c"/>
  <text x="400" y="218" text-anchor="middle" font-size="13" font-weight="900" fill="#fff">LSE</text>
  <text x="400" y="231" text-anchor="middle" font-size="10" fill="#b3d7ff">Limite Supérieure</text>

  <!-- Étiquettes bords -->
  <text x="40" y="260" text-anchor="middle" font-size="11" fill="#555">0%</text>
  <text x="40" y="274" text-anchor="middle" font-size="10" fill="#555">combustible</text>
  <text x="40" y="288" text-anchor="middle" font-size="10" fill="#555">100% air</text>

  <text x="580" y="260" text-anchor="middle" font-size="11" fill="#555">100%</text>
  <text x="580" y="274" text-anchor="middle" font-size="10" fill="#555">combustible</text>
  <text x="580" y="288" text-anchor="middle" font-size="10" fill="#555">0% air</text>

  <!-- Flèche axe -->
  <line x1="40" y1="250" x2="580" y2="250" stroke="#999" stroke-width="1.5"/>
  <polygon points="580,250 570,245 570,255" fill="#999"/>
  <text x="310" y="270" text-anchor="middle" font-size="12" fill="#666">→ Concentration croissante en combustible</text>

  <!-- Exemple tableau -->
  <rect x="40" y="285" width="540" height="28" rx="6" fill="#f8f8f8" stroke="#ddd" stroke-width="1"/>
  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#444">Exemples : Méthanol LIE 5,5 % / LSE 44 % — Essence LIE 1,1 % / LSE 7,5 % — Hydrogène LIE 4 % / LSE 75 %</text>

</svg>
