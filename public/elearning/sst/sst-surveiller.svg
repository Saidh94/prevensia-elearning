<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#FAF5FF"/>
  <rect x="60" y="60" width="1080" height="580" rx="30" fill="#FFFFFF" stroke="#D8B4FE" stroke-width="4"/>
  <text x="100" y="130" fill="#6B21A8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Etape 5 : surveiller et transmettre</text>
  <text x="100" y="175" fill="#7E22CE" font-family="Arial, Helvetica, sans-serif" font-size="24">Assurer la continuite de la prise en charge jusqu'a la releve.</text>
  <rect x="100" y="240" width="420" height="250" rx="26" fill="#F3E8FF"/>
  <circle cx="195" cy="320" r="50" fill="#C084FC"/>
  <rect x="270" y="300" width="170" height="22" rx="11" fill="#7E22CE"/>
  <rect x="270" y="342" width="130" height="22" rx="11" fill="#A855F7"/>
  <rect x="270" y="384" width="190" height="22" rx="11" fill="#C084FC"/>
  <rect x="580" y="240" width="460" height="250" rx="26" fill="#F8FAFC" stroke="#E9D5FF" stroke-width="2"/>
  <text x="620" y="300" fill="#6B21A8" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">A transmettre</text>
  <text x="620" y="350" fill="#581C87" font-family="Arial, Helvetica, sans-serif" font-size="24">• ce qui s'est passe</text>
  <text x="620" y="390" fill="#581C87" font-family="Arial, Helvetica, sans-serif" font-size="24">• ce qui a ete observe</text>
  <text x="620" y="430" fill="#581C87" font-family="Arial, Helvetica, sans-serif" font-size="24">• ce qui a deja ete fait</text>
  <rect x="100" y="525" width="940" height="80" rx="20" fill="#581C87"/>
  <text x="130" y="575" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="26">La surveillance et la transmission sont indispensables pour eviter la perte d'information au moment de la releve.</text>
</svg>