  <text x="100" y="130" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Etape 3 : alerter</text>
  <text x="100" y="175" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24">Transmettre une information claire, rapide et exploitable.</text>
  <rect x="100" y="240" width="320" height="250" rx="26" fill="#E2E8F0"/>
  <rect x="170" y="285" width="180" height="140" rx="26" fill="#0F172A"/>
