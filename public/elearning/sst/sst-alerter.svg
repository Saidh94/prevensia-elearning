  <text x="530" y="300" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Message utile</text>
  <text x="530" y="348" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24">• lieu exact</text>
