<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#EFF6FF"/>
  <rect x="60" y="60" width="1080" height="580" rx="30" fill="#FFFFFF" stroke="#93C5FD" stroke-width="4"/>
  <text x="100" y="130" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Malaise</text>
  <text x="100" y="175" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="24">Position adaptee, alerte immediate, surveillance continue.</text>
  <rect x="100" y="230" width="310" height="270" rx="24" fill="#DBEAFE"/>
  <text x="255" y="278" text-anchor="middle" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Installer</text>
  <text x="130" y="320" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="19">• Position confortable</text>
  <text x="130" y="356" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="19">• Assis, demi-assis</text>
  <text x="130" y="392" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="19">  ou allonge</text>
  <text x="130" y="432" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="19">• Ne pas laisser marcher</text>
  <text x="130" y="468" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="19">  si urgence suspectee</text>
  <rect x="450" y="230" width="310" height="270" rx="24" fill="#FEE2E2"/>
  <text x="605" y="278" text-anchor="middle" fill="#991B1B" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Urgences → 15</text>
  <text x="475" y="320" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">Douleur thoracique</text>
  <text x="475" y="350" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">→ suspicion infarctus</text>
  <text x="475" y="396" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">FAST : visage / bras /</text>
  <text x="475" y="426" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">parole / temps</text>
  <text x="475" y="456" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="18">→ suspicion AVC</text>
  <rect x="800" y="230" width="340" height="270" rx="24" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="970" y="278" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Surveiller</text>
  <text x="825" y="320" fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="19">• Conscience stable ?</text>
  <text x="825" y="360" fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="19">• Respiration normale ?</text>
  <text x="825" y="400" fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="19">• Evolution des signes ?</text>
  <text x="825" y="444" fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="19">• Perte de conscience →</text>
  <text x="825" y="474" fill="#14532D" font-family="Arial, Helvetica, sans-serif" font-size="19">  PLS ou RCP</text>
  <rect x="100" y="525" width="940" height="80" rx="20" fill="#1E3A8A"/>
  <text x="130" y="575" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="22">Un malaise peut preceder un arret cardiaque ou un AVC — ne jamais minimiser et toujours surveiller.</text>
</svg>
