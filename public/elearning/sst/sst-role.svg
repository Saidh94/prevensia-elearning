<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#F8FAFC"/>
  <rect x="50" y="50" width="1100" height="600" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <text x="90" y="130" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Role du SST dans l'entreprise</text>
  <text x="90" y="175" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24">Secourir sans improviser et contribuer a la prevention quotidienne.</text>
  <rect x="90" y="230" width="300" height="220" rx="24" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3"/>
  <text x="120" y="285" fill="#B91C1C" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Proteger</text>
  <text x="120" y="330" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="24">Eviter le suraccident</text>
  <text x="120" y="365" fill="#7F1D1D" font-family="Arial, Helvetica, sans-serif" font-size="24">Analyser le danger</text>
  <rect x="450" y="230" width="300" height="220" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
  <text x="480" y="285" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Secourir</text>
  <text x="480" y="330" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="24">Agir dans son cadre</text>
  <text x="480" y="365" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="24">Relayer aux secours</text>
  <rect x="810" y="230" width="250" height="220" rx="24" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
  <text x="840" y="285" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Prevenir</text>
  <text x="840" y="330" fill="#065F46" font-family="Arial, Helvetica, sans-serif" font-size="24">Reperer un risque</text>
  <text x="840" y="365" fill="#065F46" font-family="Arial, Helvetica, sans-serif" font-size="24">Faire remonter</text>
  <rect x="90" y="505" width="970" height="90" rx="22" fill="#0F172A"/>
  <text x="125" y="560" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28">Le SST agit vite, mais toujours avec methode, sans se substituer aux secours specialises.</text>
</svg>