<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F0FDF4"/>
  <rect x="56" y="56" width="1088" height="588" rx="28" fill="white" stroke="#BBF7D0" stroke-width="2"/>
  <text x="92" y="124" fill="#166534" font-family="Arial, sans-serif" font-size="38" font-weight="700">Opérations BS autorisées</text>
  <text x="92" y="168" fill="#166534" font-family="Arial, sans-serif" font-size="22">Remplacement simple et raccordement élémentaire dans un cadre strict.</text>

  <rect x="92" y="226" width="470" height="308" rx="24" fill="#ECFCCB" stroke="#84CC16"/>
  <rect x="638" y="226" width="470" height="308" rx="24" fill="#FEF2F2" stroke="#FCA5A5"/>

  <text x="124" y="284" fill="#3F6212" font-family="Arial, sans-serif" font-size="30" font-weight="700">Autorisé si le cadre est réuni</text>
  <text x="124" y="334" fill="#365314" font-family="Arial, sans-serif" font-size="22">• Lampe, fusible BT, prise, interrupteur</text>
  <text x="124" y="376" fill="#365314" font-family="Arial, sans-serif" font-size="22">• Raccordement élémentaire hors tension</text>
  <text x="124" y="418" fill="#365314" font-family="Arial, sans-serif" font-size="22">• Circuit identifié et procédure connue</text>
  <text x="124" y="460" fill="#365314" font-family="Arial, sans-serif" font-size="22">• Matériel simple et environnement maîtrisé</text>

  <text x="670" y="284" fill="#991B1B" font-family="Arial, sans-serif" font-size="30" font-weight="700">Interdit / hors cadre</text>
  <text x="670" y="334" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="22">• Recherche de panne ou diagnostic</text>
  <text x="670" y="376" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="22">• Modification du schéma ou du câblage</text>
  <text x="670" y="418" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="22">• Circuit non repéré ou document absent</text>
  <text x="670" y="460" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="22">• Situation qui bascule vers BR ou travaux</text>

  <rect x="92" y="566" width="1016" height="46" rx="16" fill="#0F172A"/>
  <text x="120" y="596" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="20">Réflexe sécurité : si l'action cesse d'être simple, on stoppe et on requalifie.</text>
</svg>
