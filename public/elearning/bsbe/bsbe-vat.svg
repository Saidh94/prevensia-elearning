  <rect x="92" y="510" width="1016" height="100" rx="20" fill="#0F172A"/>
  <text x="124" y="555" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22">La VAT se réalise avec une méthode fiable et un matériel conforme au cadre d'intervention.</text>
  <text x="124" y="589" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">Un multimètre d'usage courant ne remplace pas, à lui seul, le dispositif prévu pour cette vérification.</text>
