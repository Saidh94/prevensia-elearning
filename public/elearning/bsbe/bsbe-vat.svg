  <rect x="56" y="56" width="1088" height="608" rx="28" fill="white" stroke="#BFDBFE" stroke-width="2"/>

  <text x="92" y="124" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="38" font-weight="700">VAT et mise en sécurité</text>
  <text x="92" y="168" fill="#1E40AF" font-family="Arial, sans-serif" font-size="22">Vérifier l'absence de tension avec méthode, traçabilité et matériel adapté.</text>

