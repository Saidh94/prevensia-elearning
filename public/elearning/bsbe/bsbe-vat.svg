<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#EFF6FF"/>
  <rect x="70" y="70" width="1060" height="560" rx="28" fill="white" stroke="#93C5FD" stroke-width="3"/>

  <text x="110" y="135" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1D4ED8">
    VAT et mise en sécurité
  </text>

  <text x="110" y="180" font-family="Arial, sans-serif" font-size="23" fill="#1E40AF">
    Mettre hors tension, identifier, vérifier, tracer.
  </text>

  <g font-family="Arial, sans-serif">
    <rect x="110" y="245" width="175" height="190" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
    <text x="198" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">1</text>
    <text x="198" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">Séparer</text>
    <text x="198" y="390" text-anchor="middle" font-size="18" fill="#1D4ED8">Mettre hors tension</text>

    <rect x="325" y="245" width="175" height="190" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
    <text x="413" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">2</text>
    <text x="413" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">Condamner</text>
    <text x="413" y="390" text-anchor="middle" font-size="18" fill="#1D4ED8">Éviter toute remise</text>

    <rect x="540" y="245" width="175" height="190" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
    <text x="628" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">3</text>
    <text x="628" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">Identifier</text>
    <text x="628" y="390" text-anchor="middle" font-size="18" fill="#1D4ED8">Confirmer le circuit</text>

    <rect x="755" y="245" width="175" height="190" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
    <text x="843" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">4</text>
    <text x="843" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">Vérifier</text>
    <text x="843" y="390" text-anchor="middle" font-size="18" fill="#1D4ED8">VAT avec méthode</text>

    <rect x="970" y="245" width="140" height="190" rx="22" fill="#DBEAFE" stroke="#60A5FA" stroke-width="3"/>
    <text x="1040" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A8A">5</text>
    <text x="1040" y="352" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">Tracer</text>
    <text x="1040" y="390" text-anchor="middle" font-size="18" fill="#1D4ED8">Rendre compte</text>
  </g>

  <line x1="285" y1="340" x2="325" y2="340" stroke="#3B82F6" stroke-width="6"/>
  <line x1="500" y1="340" x2="540" y2="340" stroke="#3B82F6" stroke-width="6"/>
  <line x1="715" y1="340" x2="755" y2="340" stroke="#3B82F6" stroke-width="6"/>
  <line x1="930" y1="340" x2="970" y2="340" stroke="#3B82F6" stroke-width="6"/>

  <rect x="110" y="500" width="1000" height="95" rx="18" fill="#0F172A"/>
  <text x="145" y="545" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">
    La VAT se réalise avec une méthode fiable et un materiel adapte.
  </text>
  <text x="145" y="582" font-family="Arial, sans-serif" font-size="21" fill="white">
    Un multimètre courant ne remplace pas, à lui seul, le dispositif prévu.
  </text>
</svg>