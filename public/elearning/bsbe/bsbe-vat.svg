  <rect x="504" y="230" width="176" height="220" rx="24" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <rect x="710" y="230" width="176" height="220" rx="24" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <rect x="916" y="230" width="176" height="220" rx="24" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>

  <text x="165" y="286" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">1</text>
  <text x="371" y="286" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">2</text>
  <text x="577" y="286" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">3</text>
  <text x="783" y="286" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">4</text>
  <text x="989" y="286" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">5</text>

  <text x="126" y="334" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Séparer</text>
  <text x="332" y="334" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Condamner</text>
  <text x="541" y="334" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Identifier</text>
  <text x="748" y="334" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Vérifier</text>
  <text x="972" y="334" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Tracer</text>

  <text x="118" y="376" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Mettre hors énergie</text>
  <text x="118" y="404" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">la partie concernée</text>

  <text x="324" y="376" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Empêcher toute remise</text>
  <text x="324" y="404" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">sous tension intempestive</text>

  <text x="530" y="376" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Repérer sans ambiguïté</text>
  <text x="530" y="404" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">le circuit et l'organe</text>

  <text x="736" y="376" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Faire la VAT avec un</text>
  <text x="736" y="404" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">dispositif adapté</text>

  <text x="942" y="376" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Consigner l'information</text>
  <text x="942" y="404" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">et rendre compte</text>

  <path d="M268 340H298" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <path d="M474 340H504" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
