<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="42" fill="#f8fafc"/>

  <rect x="60" y="55" width="1080" height="610" rx="34" fill="#ffffff" stroke="#dbe4ef" stroke-width="2"/>

  <rect x="95" y="90" width="1010" height="145" rx="24" fill="#0f172a"/>
  <text x="135" y="145" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Cadre BS / BE Manœuvre
  </text>
  <text x="135" y="195" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#e5e7eb">
    La formation prépare. L’employeur délivre l’habilitation selon le poste réel.
  </text>

  <!-- Etape 1 -->
  <rect x="110" y="320" width="220" height="155" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="220" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1d4ed8">
    Former
  </text>
  <text x="220" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1e3a8a">
    <tspan x="220" dy="0">Cours et mises</tspan>
    <tspan x="220" dy="26">en situation</tspan>
  </text>

  <!-- Etape 2 -->
  <rect x="390" y="320" width="220" height="155" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="500" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#b45309">
    Évaluer
  </text>
  <text x="500" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#92400e">
    <tspan x="500" dy="0">Quiz et cas</tspan>
    <tspan x="500" dy="26">terrain</tspan>
  </text>

  <!-- Liaison -->
  <line x1="330" y1="398" x2="390" y2="398" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Etape 3 -->
  <rect x="670" y="320" width="220" height="155" rx="22" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
  <text x="780" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#3f6212">
    Valider
  </text>
  <text x="780" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#365314">
    <tspan x="780" dy="0">Avis formateur</tspan>
    <tspan x="780" dy="26">et adéquation</tspan>
  </text>

  <!-- Liaison -->
  <line x1="610" y1="398" x2="670" y2="398" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Etape 4 -->
  <rect x="950" y="320" width="220" height="155" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="1060" y="375" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#b91c1c">
    Habiliter
  </text>
  <text x="1060" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#991b1b">
    <tspan x="1060" dy="0">Titre délivré</tspan>
    <tspan x="1060" dy="26">selon le poste</tspan>
  </text>

  <!-- Liaison -->
  <line x1="890" y1="398" x2="950" y2="398" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Conclusion -->
  <rect x="110" y="540" width="1060" height="85" rx="18" fill="#f8fafc" stroke="#dbe4ef" stroke-width="2"/>
  <text x="145" y="575" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#0f172a">
    BS = interventions élémentaires hors tension, dans un cadre strictement limité.
  </text>
  <text x="145" y="610" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#0f172a">
    BE Manœuvre = manœuvres d’exploitation sur organe identifié et procédure connue.
  </text>
</svg>