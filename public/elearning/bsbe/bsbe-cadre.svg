<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F8FAFC"/>
  <rect x="48" y="48" width="1104" height="604" rx="32" fill="white" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="80" y="80" width="1040" height="150" rx="28" fill="#0F172A"/>
  <text x="120" y="140" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="40" font-weight="700">Cadre BS / BE Manœuvre</text>
  <text x="120" y="188" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="24">La formation prépare. L'employeur délivre l'habilitation selon le poste réel.</text>

  <rect x="92" y="292" width="230" height="180" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="350" y="292" width="230" height="180" rx="26" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <rect x="608" y="292" width="230" height="180" rx="26" fill="#ECFCCB" stroke="#65A30D" stroke-width="2"/>
  <rect x="866" y="292" width="230" height="180" rx="26" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>

  <text x="158" y="346" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Former</text>
  <text x="382" y="346" fill="#B45309" font-family="Arial, sans-serif" font-size="30" font-weight="700">Évaluer</text>
  <text x="646" y="346" fill="#3F6212" font-family="Arial, sans-serif" font-size="30" font-weight="700">Valider</text>
  <text x="900" y="346" fill="#B91C1C" font-family="Arial, sans-serif" font-size="30" font-weight="700">Habiliter</text>

  <text x="122" y="388" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="20">Cours et mises en situation</text>
  <text x="122" y="418" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="20">repérées avant l'action</text>

  <text x="380" y="388" fill="#92400E" font-family="Arial, sans-serif" font-size="20">Quiz, cas terrain et</text>
  <text x="380" y="418" fill="#92400E" font-family="Arial, sans-serif" font-size="20">vérification des acquis</text>

  <text x="638" y="388" fill="#3F6212" font-family="Arial, sans-serif" font-size="20">Avis formateur et</text>
  <text x="638" y="418" fill="#3F6212" font-family="Arial, sans-serif" font-size="20">adéquation au cadre réel</text>

  <text x="896" y="388" fill="#991B1B" font-family="Arial, sans-serif" font-size="20">Titre délivré selon</text>
  <text x="896" y="418" fill="#991B1B" font-family="Arial, sans-serif" font-size="20">mission, environnement, procédure</text>

  <path d="M322 382H350" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M580 382H608" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M838 382H866" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <rect x="92" y="530" width="1016" height="84" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="122" y="575" fill="#334155" font-family="Arial, sans-serif" font-size="24">BS = interventions élémentaires hors tension, dans un cadre strictement limité.</text>
  <text x="122" y="606" fill="#334155" font-family="Arial, sans-serif" font-size="24">BE Manœuvre = manœuvres d'exploitation sur organe identifié et procédure connue.</text>
