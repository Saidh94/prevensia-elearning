<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#ECFDF5"/>
  <rect x="70" y="70" width="1060" height="560" rx="28" fill="white" stroke="#86EFAC" stroke-width="3"/>

  <text x="600" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#166534">
    Synthese BS / BE Manoeuvre
  </text>

  <text x="600" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#166534">
    Identifier, verifier, agir si autorise, stopper si doute.
  </text>

  <g font-family="Arial, sans-serif">
    <circle cx="220" cy="360" r="105" fill="#DBEAFE" stroke="#60A5FA" stroke-width="4"/>
    <text x="220" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">1</text>
    <text x="220" y="388" text-anchor="middle" font-size="30" font-weight="700" fill="#1D4ED8">Identifier</text>

    <circle cx="470" cy="360" r="105" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
    <text x="470" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#92400E">2</text>
    <text x="470" y="388" text-anchor="middle" font-size="30" font-weight="700" fill="#92400E">Verifier</text>

    <circle cx="720" cy="360" r="105" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
    <text x="720" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#166534">3</text>
    <text x="720" y="388" text-anchor="middle" font-size="30" font-weight="700" fill="#166534">Agir</text>

    <circle cx="970" cy="360" r="105" fill="#FEE2E2" stroke="#EF4444" stroke-width="4"/>
    <text x="970" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#991B1B">4</text>
    <text x="970" y="388" text-anchor="middle" font-size="30" font-weight="700" fill="#991B1B">Stopper</text>
  </g>

  <rect x="150" y="520" width="900" height="72" rx="18" fill="#0F172A"/>
  <text x="600" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">
    Ce qui sort du cadre BS / BE doit etre transmis et requalifie.
  </text>
</svg>