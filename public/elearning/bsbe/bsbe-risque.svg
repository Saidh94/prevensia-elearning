<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#FFF7ED"/>
  <rect x="56" y="56" width="1088" height="588" rx="28" fill="white" stroke="#FED7AA" stroke-width="2"/>
  <text x="92" y="128" fill="#9A3412" font-family="Arial, sans-serif" font-size="38" font-weight="700">Risque électrique et protections</text>
  <text x="92" y="170" fill="#7C2D12" font-family="Arial, sans-serif" font-size="22">Comprendre le danger avant de remplacer, raccorder ou manœuvrer.</text>

  <rect x="92" y="228" width="300" height="148" rx="22" fill="#FFF1F2" stroke="#FDA4AF"/>
  <rect x="450" y="228" width="300" height="148" rx="22" fill="#FEF3C7" stroke="#FCD34D"/>
  <rect x="808" y="228" width="300" height="148" rx="22" fill="#EFF6FF" stroke="#93C5FD"/>

  <text x="126" y="286" fill="#9F1239" font-family="Arial, sans-serif" font-size="28" font-weight="700">Contact direct</text>
  <text x="126" y="324" fill="#881337" font-family="Arial, sans-serif" font-size="18">Toucher une partie active sous tension</text>

  <text x="486" y="286" fill="#92400E" font-family="Arial, sans-serif" font-size="28" font-weight="700">Contact indirect</text>
  <text x="486" y="324" fill="#78350F" font-family="Arial, sans-serif" font-size="18">Masse métallique devenue dangereuse</text>

  <text x="858" y="286" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28" font-weight="700">PNST / voisinage</text>
  <text x="858" y="324" fill="#1E40AF" font-family="Arial, sans-serif" font-size="18">Le danger commence avant le contact</text>

  <rect x="92" y="436" width="1016" height="152" rx="22" fill="#0F172A"/>
  <text x="128" y="490" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="28" font-weight="700">À retenir pour BS / BE Manœuvre</text>
  <text x="128" y="532" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">IP2X / IPXXB, enveloppes intactes, repérage fiable, pas d'action si capot retiré</text>
  <text x="128" y="566" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">ou si l'environnement est dégradé. La protection collective reste prioritaire.</text>
