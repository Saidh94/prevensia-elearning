<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="40" fill="#FFF1F2"/>
  <rect x="70" y="70" width="1060" height="560" rx="28" fill="white" stroke="#FDA4AF" stroke-width="3"/>

  <text x="120" y="135" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#7F1D1D">
    Effets du courant sur le corps humain
  </text>

  <text x="120" y="180" font-family="Arial, sans-serif" font-size="23" fill="#991B1B">
    Intensite, duree, trajet et humidite conditionnent la gravite.
  </text>

  <circle cx="330" cy="360" r="115" fill="#FEE2E2" stroke="#EF4444" stroke-width="4"/>
  <circle cx="330" cy="260" r="36" fill="white" stroke="#EF4444" stroke-width="4"/>
  <line x1="330" y1="296" x2="330" y2="420" stroke="#991B1B" stroke-width="9" stroke-linecap="round"/>
  <line x1="265" y1="345" x2="395" y2="345" stroke="#991B1B" stroke-width="9" stroke-linecap="round"/>
  <line x1="330" y1="420" x2="285" y2="500" stroke="#991B1B" stroke-width="9" stroke-linecap="round"/>
  <line x1="330" y1="420" x2="375" y2="500" stroke="#991B1B" stroke-width="9" stroke-linecap="round"/>

  <path d="M475 340 H570" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
  <path d="M535 295 L585 345 L535 395" stroke="#DC2626" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="640" y="230" width="420" height="240" rx="28" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="3"/>

  <text x="685" y="285" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7F1D1D">
    Ce qui aggrave
  </text>

  <text x="685" y="340" font-family="Arial, sans-serif" font-size="23" fill="#991B1B">
    Intensite plus elevee
  </text>
  <text x="685" y="382" font-family="Arial, sans-serif" font-size="23" fill="#991B1B">
    Temps de contact plus long
  </text>
  <text x="685" y="424" font-family="Arial, sans-serif" font-size="23" fill="#991B1B">
    Trajet traversant le thorax
  </text>
  <text x="685" y="466" font-family="Arial, sans-serif" font-size="23" fill="#991B1B">
    Milieu humide ou peau mouillee
  </text>

  <rect x="120" y="540" width="960" height="62" rx="16" fill="#7F1D1D"/>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white">
    Toute electrisation doit etre consideree comme serieuse.
  </text>
