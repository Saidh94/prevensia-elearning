<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="40" fill="#F8FAFC"/>
  <rect x="70" y="70" width="1060" height="580" rx="28" fill="white" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Title -->
  <text x="110" y="128" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">Classes des mat&#233;riels &#233;lectriques</text>
  <text x="110" y="165" font-family="Arial, sans-serif" font-size="21" fill="#475569">Norme NF EN 61140 &#8212; 4 classes selon le niveau de protection intrins&#232;que.</text>

  <!-- === Classe 0 (top-left) — RED: forbidden === -->
  <rect x="100" y="188" width="490" height="180" rx="20" fill="#FEF2F2" stroke="#FECACA" stroke-width="2.5"/>
  <!-- Badge -->
  <rect x="114" y="202" width="58" height="38" rx="10" fill="#DC2626"/>
  <text x="143" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">0</text>
  <text x="188" y="222" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#991B1B">Classe 0</text>
  <text x="114" y="265" font-family="Arial, sans-serif" font-size="17" fill="#7F1D1D">Isolation principale uniquement</text>
  <text x="114" y="290" font-family="Arial, sans-serif" font-size="17" fill="#7F1D1D">Aucune protection suppl&#233;mentaire</text>
  <text x="114" y="315" font-family="Arial, sans-serif" font-size="16" fill="#B91C1C">Pas de mise &#224; la terre ni de double isolation</text>
  <!-- Forbidden label -->
  <rect x="114" y="330" width="340" height="28" rx="8" fill="#DC2626"/>
  <text x="284" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="white">INTERDIT en milieu professionnel (France)</text>

  <!-- === Classe I (top-right) — GREEN: standard === -->
  <rect x="610" y="188" width="490" height="180" rx="20" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2.5"/>
  <!-- Badge -->
  <rect x="624" y="202" width="58" height="38" rx="10" fill="#16A34A"/>
  <text x="653" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">I</text>
  <text x="698" y="222" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14532D">Classe I</text>
  <!-- Earth symbol SVG -->
  <circle cx="860" cy="210" r="12" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="860" y1="222" x2="860" y2="232" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="852" y1="232" x2="868" y2="232" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="855" y1="236" x2="865" y2="236" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="858" y1="240" x2="862" y2="240" stroke="#16A34A" stroke-width="2.5"/>
  <text x="624" y="265" font-family="Arial, sans-serif" font-size="17" fill="#166534">Isolation principale + mise &#224; la terre (PE)</text>
  <text x="624" y="290" font-family="Arial, sans-serif" font-size="17" fill="#166534">Protection par disjoncteur diff&#233;rentiel</text>
  <text x="624" y="315" font-family="Arial, sans-serif" font-size="17" fill="#166534">Standard BT &#8212; outils, appareils professionnels</text>
  <text x="624" y="350" font-family="Arial, sans-serif" font-size="15" fill="#16A34A">Fiche 3 broches — prise de terre obligatoire</text>

  <!-- === Classe II (bottom-left) — BLUE: double insulation === -->
  <rect x="100" y="385" width="490" height="180" rx="20" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2.5"/>
  <!-- Badge -->
  <rect x="114" y="399" width="58" height="38" rx="10" fill="#1D4ED8"/>
  <text x="143" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">II</text>
  <text x="188" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">Classe II</text>
  <!-- Double square symbol -->
  <rect x="346" y="401" width="26" height="26" rx="3" fill="none" stroke="#1E3A8A" stroke-width="3"/>
  <rect x="354" y="409" width="26" height="26" rx="3" fill="none" stroke="#1E3A8A" stroke-width="3"/>
  <text x="114" y="462" font-family="Arial, sans-serif" font-size="17" fill="#1E40AF">Double isolation &#8212; sans mise &#224; la terre</text>
  <text x="114" y="487" font-family="Arial, sans-serif" font-size="17" fill="#1E40AF">Isolation renforc&#233;e ou suppl&#233;mentaire</text>
  <text x="114" y="512" font-family="Arial, sans-serif" font-size="17" fill="#1E40AF">Outillage portatif, appareils &#233;lectrom&#233;nagers</text>
  <text x="114" y="546" font-family="Arial, sans-serif" font-size="15" fill="#3B82F6">Symbole : carr&#233; dans le carr&#233; &#160;&#160;&#9633;&#9633;</text>

  <!-- === Classe III (bottom-right) — PURPLE: TBTS === -->
  <rect x="610" y="385" width="490" height="180" rx="20" fill="#FAF5FF" stroke="#D8B4FE" stroke-width="2.5"/>
  <!-- Badge -->
  <rect x="624" y="399" width="58" height="38" rx="10" fill="#7C3AED"/>
  <text x="653" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">III</text>
  <text x="698" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#4C1D95">Classe III</text>
  <!-- Lightning bolt symbol (TBTS) -->
  <path d="M866 400 L856 420 L864 420 L854 440 L874 418 L866 418 Z" fill="#7C3AED"/>
  <text x="624" y="462" font-family="Arial, sans-serif" font-size="17" fill="#5B21B6">Alimentation en TBTS (tr&#232;s basse tension s&#233;curit&#233;)</text>
  <text x="624" y="487" font-family="Arial, sans-serif" font-size="17" fill="#5B21B6">&#8804; 50 V alternatif / &#8804; 120 V continu</text>
  <text x="624" y="512" font-family="Arial, sans-serif" font-size="17" fill="#5B21B6">Jouets, lampes LED 12V, syst&#232;mes basse tension</text>
  <text x="624" y="546" font-family="Arial, sans-serif" font-size="15" fill="#7C3AED">Tension intrins&#232;quement s&#251;re &#8212; transformer s&#233;parateur</text>

  <!-- Bottom dark bar -->
  <rect x="100" y="578" width="980" height="58" rx="16" fill="#0F172A"/>
  <text x="590" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Identifier la classe d&#39;un mat&#233;riel permet d&#39;&#233;valuer son niveau de protection.</text>
  <text x="590" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">La classe se lit sur la plaque signalétique ou dans la notice technique.</text>
</svg>
