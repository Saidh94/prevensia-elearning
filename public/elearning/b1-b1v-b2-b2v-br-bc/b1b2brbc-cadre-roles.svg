<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F0F9FF"/>
  <rect x="40" y="40" width="1120" height="620" rx="28" fill="white" stroke="#BAE6FD" stroke-width="2"/>

  <text x="600" y="90" text-anchor="middle" fill="#0C4A6E" font-family="Arial, sans-serif" font-size="36" font-weight="700">Symboles et rôles — B1, B2, BR, BC</text>
  <text x="600" y="124" text-anchor="middle" fill="#0369A1" font-family="Arial, sans-serif" font-size="19">Chaque symbole correspond à un rôle précis et à des limites propres — ils ne s'interchangent pas.</text>

  <!-- B1 / B1V -->
  <rect x="64" y="148" width="250" height="350" rx="18" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
  <rect x="64" y="148" width="250" height="64" rx="18" fill="#1D4ED8"/>
  <rect x="64" y="194" width="250" height="18" fill="#1D4ED8"/>
  <text x="189" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">B1 / B1V</text>
  <text x="189" y="222" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="17" font-weight="700">Exécutant électricien BT</text>
  <text x="88" y="258" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Exécute les travaux</text>
  <text x="88" y="286" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Sous direction du B2</text>
  <text x="88" y="314" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ Respecte son périmètre</text>
  <text x="88" y="342" fill="#1E40AF" font-family="Arial, sans-serif" font-size="17">▸ B1V = voisinage renforcé</text>
  <line x1="88" y1="360" x2="290" y2="360" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="189" y="390" text-anchor="middle" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="16" font-weight="700">N'ORGANISE PAS</text>
  <text x="189" y="412" text-anchor="middle" fill="#3B82F6" font-family="Arial, sans-serif" font-size="15">n'est pas chargé de travaux</text>
  <rect x="88" y="436" width="202" height="44" rx="10" fill="#DBEAFE"/>
  <text x="189" y="453" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Exécute</text>
  <text x="189" y="471" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="14">dans le cadre organisé</text>

  <!-- B2 / B2V -->
  <rect x="336" y="148" width="250" height="350" rx="18" fill="#F0FDF4" stroke="#4ADE80" stroke-width="2.5"/>
  <rect x="336" y="148" width="250" height="64" rx="18" fill="#15803D"/>
  <rect x="336" y="194" width="250" height="18" fill="#15803D"/>
  <text x="461" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">B2 / B2V</text>
  <text x="461" y="222" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="17" font-weight="700">Chargé de travaux BT</text>
  <text x="360" y="258" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Prépare et organise</text>
  <text x="360" y="286" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Dirige l'équipe</text>
  <text x="360" y="314" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ Vérifie conditions sécu.</text>
  <text x="360" y="342" fill="#166534" font-family="Arial, sans-serif" font-size="17">▸ B2V = voisinage renforcé</text>
  <line x1="360" y1="360" x2="562" y2="360" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="461" y="390" text-anchor="middle" fill="#15803D" font-family="Arial, sans-serif" font-size="16" font-weight="700">DIRIGE LES TRAVAUX</text>
  <text x="461" y="412" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="15">responsable de la zone</text>
  <rect x="360" y="436" width="202" height="44" rx="10" fill="#DCFCE7"/>
  <text x="461" y="453" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="15" font-weight="700">Organise &amp; dirige</text>
  <text x="461" y="471" text-anchor="middle" fill="#14532D" font-family="Arial, sans-serif" font-size="14">le chantier électrique</text>

  <!-- BR -->
  <rect x="608" y="148" width="250" height="350" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="2.5"/>
  <rect x="608" y="148" width="250" height="64" rx="18" fill="#EA580C"/>
  <rect x="608" y="194" width="250" height="18" fill="#EA580C"/>
  <text x="733" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">BR</text>
  <text x="733" y="222" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="17" font-weight="700">Chargé d'intervention BT</text>
  <text x="632" y="258" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">▸ Dépannage limité</text>
  <text x="632" y="286" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">▸ Essais, mesurages</text>
  <text x="632" y="314" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">▸ Remise en état</text>
  <text x="632" y="342" fill="#9A3412" font-family="Arial, sans-serif" font-size="17">▸ Cadre spécifique défini</text>
  <line x1="632" y1="360" x2="834" y2="360" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="733" y="390" text-anchor="middle" fill="#EA580C" font-family="Arial, sans-serif" font-size="16" font-weight="700">INTERVENTION GÉNÉRALE</text>
  <text x="733" y="412" text-anchor="middle" fill="#C2410C" font-family="Arial, sans-serif" font-size="15">hors organisation chantier</text>
  <rect x="632" y="436" width="202" height="44" rx="10" fill="#FFEDD5"/>
  <text x="733" y="453" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="15" font-weight="700">Intervient seul</text>
  <text x="733" y="471" text-anchor="middle" fill="#7C2D12" font-family="Arial, sans-serif" font-size="14">dans un cadre restreint</text>

  <!-- BC -->
  <rect x="880" y="148" width="256" height="350" rx="18" fill="#FDF4FF" stroke="#E879F9" stroke-width="2.5"/>
  <rect x="880" y="148" width="256" height="64" rx="18" fill="#7E22CE"/>
  <rect x="880" y="194" width="256" height="18" fill="#7E22CE"/>
  <text x="1008" y="178" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="700">BC</text>
  <text x="1008" y="222" text-anchor="middle" fill="#581C87" font-family="Arial, sans-serif" font-size="17" font-weight="700">Chargé de consignation</text>
  <text x="904" y="258" fill="#6B21A8" font-family="Arial, sans-serif" font-size="17">▸ Séparation de la source</text>
  <text x="904" y="286" fill="#6B21A8" font-family="Arial, sans-serif" font-size="17">▸ Condamnation / verrouillage</text>
  <text x="904" y="314" fill="#6B21A8" font-family="Arial, sans-serif" font-size="17">▸ Identification de l'ouvrage</text>
  <text x="904" y="342" fill="#6B21A8" font-family="Arial, sans-serif" font-size="17">▸ VAT + MALT/CC si requis</text>
  <line x1="904" y1="360" x2="1112" y2="360" stroke="#E879F9" stroke-width="1.5"/>
  <text x="1008" y="390" text-anchor="middle" fill="#7E22CE" font-family="Arial, sans-serif" font-size="16" font-weight="700">CONSIGNATION</text>
  <text x="1008" y="412" text-anchor="middle" fill="#6B21A8" font-family="Arial, sans-serif" font-size="15">5 étapes réglementaires</text>
  <rect x="904" y="436" width="210" height="44" rx="10" fill="#FAE8FF"/>
  <text x="1008" y="453" text-anchor="middle" fill="#581C87" font-family="Arial, sans-serif" font-size="15" font-weight="700">Sécurise</text>
  <text x="1008" y="471" text-anchor="middle" fill="#581C87" font-family="Arial, sans-serif" font-size="14">la zone de travail</text>

  <!-- Barre bas -->
  <rect x="64" y="516" width="1072" height="108" rx="14" fill="#0C4A6E"/>
  <text x="600" y="545" text-anchor="middle" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="19" font-weight="700">Règle fondamentale : chaque symbole a ses limites propres</text>
  <text x="600" y="571" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18">Un B1 n'agit pas comme un B2. Un BR ne se transforme pas en BC parce qu'il faut aller vite.</text>
  <text x="600" y="597" text-anchor="middle" fill="#7DD3FC" font-family="Arial, sans-serif" font-size="17">Cumuler des titres ne signifie jamais mélanger les rôles sur une même opération sans clarification formelle.</text>
  <text x="600" y="619" text-anchor="middle" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="17">Une opération non préparée doit être stoppée — même si le besoin de remise en service est fort.</text>
</svg>
