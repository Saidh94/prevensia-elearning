<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FAFC"/>
  <rect x="52" y="52" width="1096" height="656" rx="28" fill="white" stroke="#CBD5E1" stroke-width="2"/>

  <text x="92" y="122" fill="#0F172A" font-family="Arial, sans-serif" font-size="38" font-weight="700">
    Chaine de decision et de securite
  </text>
  <text x="92" y="164" fill="#475569" font-family="Arial, sans-serif" font-size="22">
    Une operation electrique sure repose sur une organisation lisible et une information maitrisee.
  </text>

  <rect x="92" y="236" width="230" height="230" rx="24" fill="#DBEAFE" stroke="#60A5FA"/>
  <rect x="350" y="236" width="230" height="230" rx="24" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="608" y="236" width="230" height="230" rx="24" fill="#DCFCE7" stroke="#22C55E"/>
  <rect x="866" y="236" width="242" height="230" rx="24" fill="#FEE2E2" stroke="#EF4444"/>

  <text x="207" y="300" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="26" font-weight="700">Employeur</text>
  <text x="207" y="344" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="18">Definit les missions</text>
  <text x="207" y="374" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="18">Attribue les habilitations</text>

  <text x="465" y="300" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="26" font-weight="700">B2 / BR / BC</text>
  <text x="465" y="344" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18">Preparent ou conduisent</text>
  <text x="465" y="374" text-anchor="middle" fill="#92400E" font-family="Arial, sans-serif" font-size="18">le cadre de l'action</text>

  <text x="723" y="300" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="26" font-weight="700">B1</text>
  <text x="723" y="344" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="18">Execute selon les consignes</text>
  <text x="723" y="374" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="18">et reste dans sa limite</text>

  <text x="987" y="300" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="26" font-weight="700">Documents</text>
  <text x="987" y="344" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18">Instructions, attestations,</text>
  <text x="987" y="374" text-anchor="middle" fill="#991B1B" font-family="Arial, sans-serif" font-size="18">certificats et avis fiables</text>

  <path d="M322 352H350" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M580 352H608" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <path d="M838 352H866" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>

  <rect x="92" y="534" width="1016" height="88" rx="20" fill="#0F172A"/>
  <text x="128" y="584" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22">
    Aucun glissement de mission : si le contexte change, l'operation est stoppee,
  </text>
  <text x="128" y="614" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22">
    clarifiee puis requalifiee avant toute reprise.
  </text>
</svg>
