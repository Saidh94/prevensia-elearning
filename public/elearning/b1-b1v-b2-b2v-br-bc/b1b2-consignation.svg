  <text x="92" y="122" fill="#0F172A" font-family="Arial, sans-serif" font-size="38" font-weight="700">
    Consignation et verification d'absence de tension
  </text>
  <text x="92" y="164" fill="#334155" font-family="Arial, sans-serif" font-size="22">
    Une sequence rigoureuse qui n'admet ni approximation ni memoire selective.
  </text>

