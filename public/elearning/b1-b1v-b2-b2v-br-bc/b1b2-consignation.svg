  <text x="184" y="296" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Separation</text>
  <text x="184" y="344" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">Isoler le bon</text>
  <text x="184" y="370" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">circuit</text>

  <text x="390" y="296" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Condamnation</text>
  <text x="390" y="344" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">Bloquer toute</text>
  <text x="390" y="370" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">remise sous tension</text>

  <text x="596" y="296" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Identification</text>
  <text x="596" y="344" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">Verifier le</text>
  <text x="596" y="370" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">bon perimetre</text>

  <text x="802" y="296" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">VAT</text>
