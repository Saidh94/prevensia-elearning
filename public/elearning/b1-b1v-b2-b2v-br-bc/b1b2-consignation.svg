  <text x="802" y="370" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">reellement</text>

  <text x="1012" y="296" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Remise</text>
  <text x="1012" y="344" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">Restituer sous</text>
  <text x="1012" y="370" text-anchor="middle" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="16">controle</text>

  <path d="M276 356H298" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
