<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#FFF7ED"/>
  <rect x="56" y="56" width="1088" height="588" rx="28" fill="white" stroke="#FED7AA" stroke-width="2"/>
  <text x="92" y="124" fill="#C2410C" font-family="Arial, sans-serif" font-size="38" font-weight="700">Mesurages, essais et remise en énergie</text>
  <text x="92" y="166" fill="#9A3412" font-family="Arial, sans-serif" font-size="22">Les moments les plus accidentogènes sont souvent ceux où l'on veut « vérifier vite ».</text>
  <circle cx="258" cy="386" r="86" fill="#FFEDD5" stroke="#FB923C" stroke-width="2"/>
  <circle cx="600" cy="386" r="86" fill="#FFEDD5" stroke="#FB923C" stroke-width="2"/>
  <circle cx="942" cy="386" r="86" fill="#FFEDD5" stroke="#FB923C" stroke-width="2"/>
  <text x="198" y="380" fill="#9A3412" font-family="Arial, sans-serif" font-size="24" font-weight="700">Mesurer</text>
  <text x="544" y="380" fill="#9A3412" font-family="Arial, sans-serif" font-size="24" font-weight="700">Essayer</text>
  <text x="868" y="380" fill="#9A3412" font-family="Arial, sans-serif" font-size="24" font-weight="700">Remettre</text>
  <text x="186" y="416" fill="#9A3412" font-family="Arial, sans-serif" font-size="18">Appareil adapte et cadre clair</text>
  <text x="528" y="416" fill="#9A3412" font-family="Arial, sans-serif" font-size="18">Coordination et objectif definis</text>
  <text x="864" y="416" fill="#9A3412" font-family="Arial, sans-serif" font-size="18">Fin d'opération vérifiée</text>
  <rect x="92" y="544" width="1016" height="66" rx="18" fill="#7C2D12"/>
  <text x="122" y="584" fill="#FFEDD5" font-family="Arial, sans-serif" font-size="20">Un geste techniquement possible n'est pas automatiquement un geste autorisé par l'habilitation détenue.</text>

</svg>