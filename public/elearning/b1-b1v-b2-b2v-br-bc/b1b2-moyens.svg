<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FAFC"/>
  <rect x="52" y="52" width="1096" height="656" rx="28" fill="white" stroke="#CBD5E1" stroke-width="2"/>

  <text x="92" y="122" fill="#0F172A" font-family="Arial, sans-serif" font-size="38" font-weight="700">
    Preparer ses moyens avant d'agir
  </text>
  <text x="92" y="164" fill="#475569" font-family="Arial, sans-serif" font-size="22">
    La securite repose sur des outils fiables, des protections adaptees et une zone compatible.
  </text>

  <rect x="92" y="236" width="470" height="180" rx="24" fill="#E2E8F0"/>
  <rect x="638" y="236" width="470" height="180" rx="24" fill="#E2E8F0"/>
  <rect x="92" y="450" width="470" height="180" rx="24" fill="#E2E8F0"/>
  <rect x="638" y="450" width="470" height="180" rx="24" fill="#E2E8F0"/>

  <text x="126" y="298" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Outils adaptes</text>
  <text x="126" y="340" fill="#334155" font-family="Arial, sans-serif" font-size="20">Outillage conforme, propre,</text>
  <text x="126" y="370" fill="#334155" font-family="Arial, sans-serif" font-size="20">sans degradation visible.</text>

  <text x="672" y="298" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">EPI / EPC</text>
  <text x="672" y="340" fill="#334155" font-family="Arial, sans-serif" font-size="20">Protections collectives maintenues,</text>
  <text x="672" y="370" fill="#334155" font-family="Arial, sans-serif" font-size="20">EPI en complement et jamais seuls.</text>

  <text x="126" y="512" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Mesures fiables</text>
  <text x="126" y="554" fill="#334155" font-family="Arial, sans-serif" font-size="20">Appareil adapte, methode connue,</text>
  <text x="126" y="584" fill="#334155" font-family="Arial, sans-serif" font-size="20">verification avant et apres usage.</text>

  <text x="672" y="512" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Zone conforme</text>
  <text x="672" y="554" fill="#334155" font-family="Arial, sans-serif" font-size="20">Acces possible, humidite maitrisee,</text>
  <text x="672" y="584" fill="#334155" font-family="Arial, sans-serif" font-size="20">aucune anomalie critique visible.</text>
</svg>
