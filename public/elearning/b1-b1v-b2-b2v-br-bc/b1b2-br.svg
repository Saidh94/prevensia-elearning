<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="700" rx="36" fill="#F0FDF4"/>
  <rect x="56" y="56" width="1088" height="588" rx="28" fill="white" stroke="#BBF7D0" stroke-width="2"/>
  <text x="92" y="124" fill="#166534" font-family="Arial, sans-serif" font-size="38" font-weight="700">Interventions generales BR</text>
  <text x="92" y="166" fill="#166534" font-family="Arial, sans-serif" font-size="22">Depanner sans improviser, diagnostiquer sans sortir de son cadre</text>
  <rect x="92" y="232" width="490" height="318" rx="24" fill="#DCFCE7" stroke="#22C55E"/>
  <rect x="618" y="232" width="490" height="318" rx="24" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="126" y="288" fill="#166534" font-family="Arial, sans-serif" font-size="30" font-weight="700">Reste dans le cadre BR</text>
  <text x="126" y="332" fill="#166534" font-family="Arial, sans-serif" font-size="20">• Intervention identifiee</text>
  <text x="126" y="368" fill="#166534" font-family="Arial, sans-serif" font-size="20">• Methode, mesures, remise en etat proportionnee</text>
  <text x="126" y="404" fill="#166534" font-family="Arial, sans-serif" font-size="20">• Environnement et voisinage maitrises</text>
  <text x="652" y="288" fill="#991B1B" font-family="Arial, sans-serif" font-size="30" font-weight="700">Sort du cadre BR</text>
  <text x="652" y="332" fill="#991B1B" font-family="Arial, sans-serif" font-size="20">• Multiplicite de circuits ou schema incertain</text>
  <text x="652" y="368" fill="#991B1B" font-family="Arial, sans-serif" font-size="20">• Modification de structure</text>
  <text x="652" y="404" fill="#991B1B" font-family="Arial, sans-serif" font-size="20">• Travaux ou consignation a requalifier</text>
  <rect x="92" y="582" width="1016" height="42" rx="14" fill="#0F172A"/>
  <text x="124" y="610" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="19">Le BR est sensible car il se situe au croisement de l'urgence, du diagnostic et du risque d'improvisation.</text>
</svg>
